[project]
name = "permit-assistant"
version = "0.1.0"
description = "서울시 건축 인허가 사전진단 AI 어시스턴트"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "jenyyang"},
]
dependencies = [
    # LangChain 생태계
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-huggingface>=0.1.0",
    "langchain-chroma>=0.1.0",
    "langchain-text-splitters>=0.3.0",
    # LangGraph
    "langgraph>=0.2.0",
    "langsmith>=0.1.0",
    # 벡터DB / 임베딩
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # 문서 로더
    "pypdf>=5.0.0",
    "pymupdf>=1.24.0",
    "unstructured[html]>=0.15.0",
    # API 서버 (Phase 2 이후)
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    # 유틸
    "python-dotenv>=1.0.0",
    "langchain-cerebras>=0.8.2",
    "langchain-classic>=1.0.0",  # SQLRecordManager (증분 인덱싱용, langchain v1에서 여기로 이동)
    "pyhwp>=0.1b15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]
eval = [
    "ragas>=0.2.0",
    "pandas>=2.0.0",
    "datasets>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
