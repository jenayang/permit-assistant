<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울시 건축 인허가 어시스턴트</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2328;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --bot-bubble: #f0f2f5;
    --error: #dc2626;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .layout {
    display: flex;
    height: 100vh;
  }
  .app {
    flex: 1;
    min-width: 0;
    max-width: 760px;
    margin: 0 auto;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  header .sub {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  #newChatBtn {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
  }
  #newChatBtn:hover { background: var(--bg); }

  /* 사이드 패널: 인허가 등반 로드맵 */
  .side-panel {
    width: 240px;
    flex-shrink: 0;
    border-left: 1px solid var(--border);
    background: var(--panel);
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
  }
  .side-panel-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
    text-align: center;
  }
  .fact-tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 14px;
  }
  .fact-tag {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .fact-tag.result {
    border-color: var(--accent);
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
  }
  .climb-hint {
    margin: auto 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
  }
  .climb-hint .peak {
    font-size: 28px;
    display: block;
    margin-bottom: 8px;
  }
  .climb-path {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
  }
  .climb-node {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 2px;
  }
  .climb-dot {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--panel);
    border: 2px solid var(--border);
    opacity: 0.45;
  }
  .climb-node.done .climb-dot {
    background: var(--accent);
    border-color: var(--accent);
    opacity: 1;
  }
  .climb-node.current .climb-dot {
    background: var(--panel);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
    opacity: 1;
  }
  .climb-label {
    font-size: 11px;
    color: var(--text-muted);
    max-width: 140px;
    line-height: 1.4;
  }
  .climb-node.current .climb-label {
    color: var(--accent);
    font-weight: 600;
  }
  .climb-line {
    width: 2px;
    height: 22px;
    background: var(--border);
    border-radius: 1px;
    opacity: 0.4;
  }
  .climb-line.done { background: var(--accent); opacity: 1; }
  .stage-caption {
    margin-top: 16px;
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.5;
  }
  @media (max-width: 900px) {
    .side-panel { display: none; }
  }

  .branch-prompt {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 8px;
  }
  .branch-btn {
    border: 1px solid var(--accent);
    background: var(--panel);
    color: var(--accent);
    padding: 8px 10px;
    border-radius: 8px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .branch-btn:hover { background: var(--accent); color: var(--accent-text); }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 14px;
  }
  .msg.user .bubble {
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.bot .bubble.error {
    background: #fef2f2;
    color: var(--error);
  }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .bubble strong { font-weight: 700; }
  .bubble hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 8px 0;
  }
  .bubble .md-h1, .bubble .md-h2 { font-size: 1.1em; font-weight: 700; margin: 6px 0 4px; }
  .bubble .md-h3, .bubble .md-h4 { font-size: 1.03em; font-weight: 700; margin: 6px 0 4px; }
  .bubble .md-h5, .bubble .md-h6 { font-weight: 700; margin: 6px 0 4px; }
  .bubble code {
    background: rgba(0, 0, 0, 0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9em;
  }
  @media (prefers-color-scheme: dark) {
    .bubble code { background: rgba(255, 255, 255, 0.12); }
  }
  .tool-tag {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  .typing { display: flex; gap: 4px; padding: 12px 14px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #question {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    line-height: 1.4;
  }
  #question:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    padding: 0 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-hint {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #1f2126;
      --border: #2c2e34;
      --text: #e8e9ec;
      --text-muted: #9aa0a8;
      --bot-bubble: #2a2c32;
    }
    .msg.bot .bubble.error { background: #3a1f1f; }
  }
</style>
</head>
<body>
<div class="layout">
  <div class="app">
    <header>
      <div>
        <h1>서울시 건축 인허가 어시스턴트</h1>
        <div class="sub" id="userIdLabel"></div>
      </div>
      <button id="newChatBtn" type="button">새 대화</button>
    </header>

    <div id="chat">
      <div class="empty-hint" id="emptyHint">
        지역, 시설 유형, 규모를 알려주시면 인허가 절차를 안내해드려요.<br>
        예) "강남구에 20평 카페 창업하려는데 뭐부터 해야 해?"
      </div>
    </div>

    <form id="composer">
      <textarea id="question" rows="1" placeholder="질문을 입력하세요 (Enter로 전송, Shift+Enter로 줄바꿈)"></textarea>
      <button id="sendBtn" type="submit">전송</button>
    </form>
  </div>

  <aside class="side-panel">
    <div class="side-panel-title">🏔️ 인허가 등반 로드맵</div>
    <div class="fact-tags" id="factTags" style="display:none;"></div>
    <div class="climb-hint" id="climbHint">
      <span class="peak">🏔️</span>
      대화를 시작하면<br>여기에 진행 상황이 표시돼요
    </div>
    <div class="climb-path" id="climbPath" style="display:none;"></div>
    <div class="stage-caption">실제 절차는 사안에 따라<br>다를 수 있어 참고용입니다.</div>
  </aside>
</div>

<script>
  const API_BASE = "";
  const chatEl = document.getElementById("chat");
  const emptyHint = document.getElementById("emptyHint");
  const form = document.getElementById("composer");
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const userIdLabel = document.getElementById("userIdLabel");
  const newChatBtn = document.getElementById("newChatBtn");
  const climbHintEl = document.getElementById("climbHint");
  const climbPathEl = document.getElementById("climbPath");
  const factTagsEl = document.getElementById("factTags");

  function getUserId() {
    let id = localStorage.getItem("permit_assistant_user_id");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("permit_assistant_user_id", id);
    }
    return id;
  }

  let userId = getUserId();
  userIdLabel.textContent = `세션: ${userId.slice(0, 8)}`;

  let procedureTree = {};
  // 대화 중 set_procedure_stage로 보고된 노드를 순서대로 누적 (분기 트리라
  // "전체 경로"를 한 번에 알 수 없어서, 지금까지 실제로 지나온 노드만 기록)
  let visitedNodes = [];

  // record_case_facts로 이번 대화에서 확인된 사실들을 로드맵 상단에 태그로
  // 누적 표시(읽기 전용) - 사용자가 "내가 말한 게 이렇게 정리됐구나"를 실시간
  // 확인하고, 빠지거나 틀린 게 있으면 대화로 스스로 정정하도록 유도하는 용도.
  let caseFacts = {};
  let caseTypeResult = null; // set_procedure_stage로 확정된 허가/신고/기재변경 등

  // case_facts 필드 → 태그 텍스트 변환. 여기 없는 필드는 태그로 안 보임(값
  // 하나만으로는 뜻이 안 통하는 필드는 아래에서 조합해서 별도 처리).
  const FACT_TAG_LABELS = {
    act_type: (v) => v,
    ownership: (v) => v,
    size_sqm: (v) => `연면적 ${v}㎡`,
    floors: (v) => `${v}층`,
    extension_size_sqm: (v) => `증축면적 ${v}㎡`,
    land_zone: (v) => v,
    renovation_scope: (v) => (v ? "대수선 해당" : "대수선 미해당"),
    temporary_purpose: (v) => v,
    temporary_duration_years: (v) => `존치 ${v}년`,
    temporary_is_concrete: (v) => (v ? "철근콘크리트조" : "비철콘크리트조"),
  };

  function renderFactTags() {
    const chips = [];
    for (const [key, value] of Object.entries(caseFacts)) {
      if (value == null || key === "_classified") continue;
      if (key === "current_facility_group" || key === "desired_facility_group") continue;
      const fmt = FACT_TAG_LABELS[key];
      if (fmt) chips.push(fmt(value));
    }
    if (caseFacts.current_facility_group != null && caseFacts.desired_facility_group != null) {
      chips.push(`시설군 ${caseFacts.current_facility_group}→${caseFacts.desired_facility_group}`);
    }

    factTagsEl.innerHTML = "";
    chips.forEach((text) => {
      const span = document.createElement("span");
      span.className = "fact-tag";
      span.textContent = text;
      factTagsEl.appendChild(span);
    });
    if (caseTypeResult) {
      const span = document.createElement("span");
      span.className = "fact-tag result";
      span.textContent = caseTypeResult;
      factTagsEl.appendChild(span);
    }
    factTagsEl.style.display = chips.length || caseTypeResult ? "flex" : "none";
  }

  async function loadProcedureStages() {
    try {
      const res = await fetch(`${API_BASE}/procedure-stages`);
      procedureTree = await res.json();
    } catch (err) {
      procedureTree = {};
    }
  }

  function getNode(caseType, nodeId) {
    return procedureTree[caseType]?.nodes?.[nodeId] || null;
  }

  function reportStageNode(caseType, nodeId) {
    const last = visitedNodes[visitedNodes.length - 1];
    if (last && last.caseType === caseType && last.nodeId === nodeId) return; // 직전과 동일하면 스킵
    visitedNodes.push({ caseType, nodeId });
    localStorage.setItem("permit_assistant_visited", JSON.stringify(visitedNodes));
    renderStagePanel();
  }

  // 지금까지 확정된 노드(분기 포함, 연속 중복 제거) + 마지막이 "단계"면 다음
  // 단계들을 미확정 미리보기로 이어붙인 전체 경로. 분기라서 그 뒤가 갈리는
  // 지점(아직 답 안 한 분기)에서는 미리보기를 멈춘다(모르는 걸 지어내지 않음).
  function buildPathNodes(caseType) {
    const confirmedIds = visitedNodes
      .filter(v => v.caseType === caseType)
      .map(v => v.nodeId)
      .filter((id, i, arr) => id !== arr[i - 1]);
    if (confirmedIds.length === 0) return { ids: [], confirmedCount: 0 };

    const ids = [...confirmedIds];
    let last = getNode(caseType, ids[ids.length - 1]);
    while (last && last.type === "stage" && last.next) {
      ids.push(last.next);
      last = getNode(caseType, last.next);
    }
    return { ids, confirmedCount: confirmedIds.length };
  }

  function renderStagePanel() {
    if (visitedNodes.length === 0) {
      climbHintEl.style.display = "block";
      climbPathEl.style.display = "none";
      return;
    }
    const last = visitedNodes[visitedNodes.length - 1];
    const { caseType } = last;
    const { ids, confirmedCount } = buildPathNodes(caseType);
    if (ids.length === 0) return;

    const currentIdx = confirmedCount - 1;

    climbHintEl.style.display = "none";
    climbPathEl.innerHTML = "";
    climbPathEl.style.display = "flex";

    // column-reverse 컨테이너라 배열 순서(시작→완료)대로 append하면 시작이
    // 맨 아래, 완료(또는 아직 안 정해진 미래)가 맨 위로 렌더링돼서 "등반"
    // 느낌이 나고, 확정 안 된 구간은 CSS 기본 투명도로 흐리게 보인다.
    ids.forEach((id, i) => {
      const node = getNode(caseType, id);
      if (i > 0) {
        const line = document.createElement("div");
        line.className = "climb-line" + (i <= currentIdx ? " done" : "");
        climbPathEl.appendChild(line);
      }
      const el = document.createElement("div");
      const state = i < currentIdx ? "done" : i === currentIdx ? "current" : "upcoming";
      el.className = `climb-node ${state}`;
      // 분기 노드는 질문 내용을 로드맵에 미리 안 보여줌 - 대화로 알아가게 함
      const label = node.type === "branch" ? "" : node.label;
      el.innerHTML = `<div class="climb-dot"></div>` + (label ? `<div class="climb-label">${label}</div>` : "");
      climbPathEl.appendChild(el);
    });

    // 현재 위치가 분기면, 경로 아래에 질문+선택지 버튼도 이어서 보여줌
    const currentNode = getNode(caseType, ids[currentIdx]);
    if (currentNode && currentNode.type === "branch") {
      const prompt = document.createElement("div");
      prompt.className = "branch-prompt";
      Object.keys(currentNode.options).forEach(choice => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "branch-btn";
        btn.textContent = choice;
        btn.addEventListener("click", () => sendQuestion(choice));
        prompt.appendChild(btn);
      });
      climbPathEl.appendChild(prompt);
    }
  }

  function restoreStageIndicator() {
    const saved = localStorage.getItem("permit_assistant_visited");
    if (saved) {
      try { visitedNodes = JSON.parse(saved); } catch (err) { visitedNodes = []; }
      renderStagePanel();
    }
    const savedFacts = localStorage.getItem("permit_assistant_case_facts");
    if (savedFacts) {
      try { caseFacts = JSON.parse(savedFacts); } catch (err) { caseFacts = {}; }
    }
    caseTypeResult = localStorage.getItem("permit_assistant_case_type");
    renderFactTags();
  }

  function resetStageIndicator() {
    visitedNodes = [];
    climbPathEl.style.display = "none";
    climbPathEl.innerHTML = "";
    climbHintEl.style.display = "block";
    caseFacts = {};
    caseTypeResult = null;
    renderFactTags();
  }

  // 봇 답변에 섞여오는 마크다운(**굵게**, - 목록, `코드`)을 그대로 텍스트로
  // 찍으면 별표가 그대로 보여서 지저분해지므로, 안전하게 이스케이프한 뒤
  // 최소한의 문법만 변환한다. 사용자 메시지는 대상이 아님(textContent 그대로).
  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderInline(line) {
    return line
      .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function renderMarkdown(text) {
    const lines = escapeHtml(text).split("\n");
    const html = [];
    let listType = null; // "ul" | "ol" | null

    function closeList() {
      if (listType) { html.push(`</${listType}>`); listType = null; }
    }

    lines.forEach(rawLine => {
      const trimmed = rawLine.trim();
      const headerMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
      const hrMatch = trimmed.match(/^(-{3,}|\*{3,}|_{3,})$/);
      const bulletMatch = trimmed.match(/^[-*]\s+(.*)$/);
      const orderedMatch = trimmed.match(/^\d+\.\s+(.*)$/);

      if (headerMatch) {
        closeList();
        html.push(`<div class="md-h${headerMatch[1].length}">${renderInline(headerMatch[2])}</div>`);
      } else if (hrMatch) {
        closeList();
        html.push("<hr>");
      } else if (bulletMatch) {
        if (listType !== "ul") { closeList(); html.push("<ul>"); listType = "ul"; }
        html.push(`<li>${renderInline(bulletMatch[1])}</li>`);
      } else if (orderedMatch) {
        if (listType !== "ol") { closeList(); html.push("<ol>"); listType = "ol"; }
        html.push(`<li>${renderInline(orderedMatch[1])}</li>`);
      } else {
        closeList();
        html.push(trimmed === "" ? "<br>" : `<div>${renderInline(rawLine)}</div>`);
      }
    });
    closeList();
    return html.join("");
  }

  function addMessage(role, text, { toolCalls = [], isError = false } = {}) {
    emptyHint.remove();
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " error" : "");
    if (role === "bot") {
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }
    wrap.appendChild(bubble);

    if (toolCalls && toolCalls.length > 0) {
      const tag = document.createElement("div");
      tag.className = "tool-tag";
      tag.textContent = "🔧 " + toolCalls.map(tc => tc.tool).join(", ");
      wrap.appendChild(tag);
    }

    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  function addTypingIndicator() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typingIndicator";
    wrap.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTypingIndicator() {
    document.getElementById("typingIndicator")?.remove();
  }

  async function sendQuestion(question) {
    addMessage("user", question);
    questionEl.value = "";
    questionEl.style.height = "auto";
    sendBtn.disabled = true;
    addTypingIndicator();

    try {
      const res = await fetch(`${API_BASE}/query`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, user_id: userId }),
      });

      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) {
        addMessage("bot", data.detail || "답변 생성에 실패했습니다.", { isError: true });
        return;
      }

      userId = data.user_id;
      localStorage.setItem("permit_assistant_user_id", userId);
      userIdLabel.textContent = `세션: ${userId.slice(0, 8)}`;

      addMessage("bot", data.answer, { toolCalls: data.tool_calls });

      // 한 턴에 여러 번 호출될 수 있어(트리를 여러 노드 이어서 지나간 경우,
      // 혹은 record_case_facts + set_procedure_stage가 같이 온 경우) 순서대로 전부 반영
      let factsChanged = false;
      (data.tool_calls || []).forEach(tc => {
        if (tc.tool === "set_procedure_stage") {
          caseTypeResult = tc.args.case_type;
          localStorage.setItem("permit_assistant_case_type", caseTypeResult);
          factsChanged = true;
          reportStageNode(tc.args.case_type, tc.args.node_id);
        } else if (tc.tool === "record_case_facts") {
          for (const [k, v] of Object.entries(tc.args)) {
            if (v !== null && v !== undefined) caseFacts[k] = v;
          }
          localStorage.setItem("permit_assistant_case_facts", JSON.stringify(caseFacts));
          factsChanged = true;
        }
      });
      if (factsChanged) renderFactTags();
    } catch (err) {
      removeTypingIndicator();
      addMessage("bot", `서버에 연결할 수 없습니다: ${err.message}`, { isError: true });
    } finally {
      sendBtn.disabled = false;
      questionEl.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = questionEl.value.trim();
    if (!q) return;
    sendQuestion(q);
  });

  questionEl.addEventListener("keydown", (e) => {
    // e.isComposing: 한글 등 IME로 글자를 조합하는 중에 눌린 엔터는 무시.
    // 이걸 안 걸러주면 조합 확정용 엔터랑 전송용 엔터가 겹쳐서, preventDefault가
    // IME 조합 상태를 꼬아버려 마지막 글자가 다음 입력에 한 번 더 끼어드는
    // 문제가 생긴다.
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  questionEl.addEventListener("input", () => {
    questionEl.style.height = "auto";
    questionEl.style.height = Math.min(questionEl.scrollHeight, 120) + "px";
  });

  newChatBtn.addEventListener("click", () => {
    localStorage.removeItem("permit_assistant_user_id");
    localStorage.removeItem("permit_assistant_visited");
    localStorage.removeItem("permit_assistant_case_facts");
    localStorage.removeItem("permit_assistant_case_type");
    userId = getUserId();
    userIdLabel.textContent = `세션: ${userId.slice(0, 8)}`;
    chatEl.innerHTML = "";
    chatEl.appendChild(emptyHint);
    resetStageIndicator();
  });

  loadProcedureStages().then(restoreStageIndicator);
  questionEl.focus();
</script>
</body>
</html>
