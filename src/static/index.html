<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울시 건축 인허가 어시스턴트</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2328;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --bot-bubble: #f0f2f5;
    --error: #dc2626;
    /* 로드맵 "완료" 상태색 - 원래 초록(#1f9d55)이었는데 전체 팔레트를 파란
       계열로 통일해달라는 요청(2026-07-28)으로 --accent(진행중)보다 짙은
       남색으로 교체. 완료ᆞ진행중ᆞ대기를 색상(hue)이 아니라 명도로 구분한다. */
    --done: #1e40af;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 14px rgba(16, 24, 40, .05);
    --surface-2: #eef1f5;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  /* 시안 A(2단 대시보드) 화면 비율ᆞ구조를 그대로 반영(2026-07-28) - 가운데
     정렬된 1180px 컨테이너, 상단에 헤더+진행률 카드(전체 폭), 그 아래
     "채팅 카드(1fr) + 로드맵 카드(360px 고정)" 그리드. 예전엔 채팅이
     그냥 전체 배경 위에 떠 있었는데, 이제 채팅도 카드로 감싸 로드맵
     패널과 시각적으로 동급인 두 개의 패널처럼 보이게 한다. */
  .layout {
    /* manyfast 참조 화면처럼 전체 뷰포트를 쓴다 - 예전 1180px 중앙정렬
       "대시보드 박스" 느낌을 없앤다(2026-08-04). */
    height: 100vh;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
  }
  header {
    padding: 14px 24px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }
  /* 세션 라벨을 제목 아래(왼쪽)가 아니라 "새 대화" 버튼 옆(오른쪽)으로 이동
     - 제목 아래 자리는 현재 상황 태그(업종ᆞ판정ᆞ주소)에 내준다(2026-07-28
     피드백, 아티팩트 A 시안처럼). */
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  header .sub {
    font-size: 12px;
    color: var(--text-muted);
  }
  /* 제목 아래 현재 상황 태그 - "일반음식점 · 용도변경(근린생활시설군 內) ·
     자양동 65-1"처럼 업종ᆞ판정ᆞ주소를 한눈에. 데이터가 아직 없는 항목은
     생략하고 있는 것만 이어붙인다. */
  .header-tags {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  #newChatBtn, #intakeLink {
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  #newChatBtn:hover, #intakeLink:hover { background: var(--bg); }

  .main-grid {
    flex: 1;
    min-height: 0;
    display: grid;
    /* manyfast 참조 화면의 셸(좌측 내비 컬럼 + 우측 메인 콘텐츠) 그대로 -
       챗봇(.app)이 그 좌측 내비 자리, 로드맵(.side-panel)이 메인 영역.
       카드처럼 감싸지 않고 옅은 구분선(border-right) 하나로만 나눈다
       (2026-08-04, "박스 안의 박스 느낌 없애고 화면 크게" 요청). */
    grid-template-columns: 340px 1fr;
  }
  .app {
    min-width: 0;
    min-height: 0;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .chat-panel-title {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .06em;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 14px 20px 0;
    flex-shrink: 0;
  }

  /* 메인 콘텐츠(로드맵) - 예전엔 둥근 테두리+그림자로 감싼 독립 카드였는데,
     manyfast 참조 화면처럼 테두리 없이 전체 폭을 쓰고 내부 여백만 넉넉히
     둔다(2026-08-04). */
  .side-panel {
    min-width: 0;
    min-height: 0;
    padding: 32px 40px;
    display: flex;
    flex-direction: column;
    overflow-y: auto;
  }
  .side-panel-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  /* 개요 화면("맞춤형 로드맵 결과") 상단 3개 카드 - manyfast 참조 이미지의
     페이지 헤더ᆞ요약 카드ᆞ진행률 카드ᆞ다음 단계 카드 구성을 그대로 따른다
     (2026-08-04). 색은 기존 다크/라이트 팔레트(--panel/--border 등) 그대로
     쓰고 톤(카드 구분ᆞ여백ᆞpill 배지)만 맞춘다. */
  .page-header { width: 100%; text-align: left; margin-bottom: 14px; }
  .page-header h2 { font-size: 16px; margin: 0; }
  .summary-card, .progress-card, .next-step-card {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: var(--shadow);
    padding: 16px 18px;
    margin-bottom: 14px;
  }
  .card-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
  .summary-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px 16px;
  }
  .summary-label { display: block; font-size: 11px; color: var(--text-muted); }
  .summary-value { display: block; font-size: 13px; font-weight: 600; margin-top: 2px; }
  .summary-notice { font-size: 11px; color: var(--text-muted); margin-top: 12px; }
  .progress-bar { width: 100%; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); border-radius: 4px; }
  .progress-pct { font-size: 12px; color: var(--text-muted); margin-top: 6px; text-align: right; }
  .progress-stats { display: flex; gap: 10px; margin-top: 12px; }
  .progress-stats > div {
    flex: 1;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 4px;
  }
  .stat-num { display: block; font-size: 16px; font-weight: 700; }
  .stat-label { display: block; font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .next-step-body { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .next-step-text { font-size: 13px; }
  .next-step-btn {
    flex-shrink: 0;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  /* Next Action 위젯 - "질문에 답하는 챗봇"이 아니라 "먼저 알려주는 프로젝트
     매니저"가 되자는 원칙(2026-07-28 논의)에 따라, 사용자가 안 물어봐도
     항상 보이는 위치에 지금 단계ᆞ진행률ᆞ다음 할 일을 고정 표시한다.
     compute_project_status()가 계산한 값을 그대로 반영만 하고, 프론트에서
     새로 판단하지 않는다(로드맵 패널과 서로 다른 숫자를 말하면 안 됨). */
  .next-action {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    box-sizing: border-box;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
  }
  .next-action:empty { display: none; border-bottom: none; }
  .next-action-pct {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    flex-shrink: 0;
  }
  .next-action-body { flex: 1; min-width: 0; }
  .next-action-progress { margin-bottom: 10px; }
  .next-action-bar {
    height: 6px;
    border-radius: 3px;
    background: var(--bg);
    overflow: hidden;
  }
  .next-action-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
  }
  /* "해야 할 일" 표기 - 아티팩트 A 시안 그대로: 헤드라인(A와 동일한
     12.5px, 일반 굵기, 핵심 문구만 강조)ᆞpct(22px) 크기를 그대로 따른다
     (2026-07-28: 한 차례 과하게 키웠다가 "너무 크다ᆞ서체도 다르다"는
     피드백으로 A 원안 크기로 되돌림). 트랙이 2개(건축ᆞ창업 준비)라도
     A 예시처럼 한 줄로 합쳐서 보여준다("2개라도 한 줄로" 피드백) -
     트랙별로 줄을 나누면 위젯이 다시 길어지고 눈에 덜 띈다. %는 B의
     원형 링 대신 기존 긴 막대 그래프를 유지. */
  .next-action-headline {
    font-size: 12.5px;
    font-weight: 400;
    color: var(--text-muted);
    line-height: 1.5;
    text-wrap: balance;
  }
  .next-action-headline strong { color: var(--accent); font-weight: 700; }
  /* 전체 창업 로드맵(Step 0~4) - "AI가 확인된 사실만 진행률에 반영한다"는
     원칙에 따라, 판정(permit_result/food_result/fire_result/signage_result)이
     난 항목과 사용자가 완료를 직접 말한 항목(task_progress)만 체크된다 -
     안내 도구를 보여줬다는 이유로 체크되지 않는다(2026-07-27 논의). */
  .roadmap {
    width: 100%;
    display: flex;
    flex-direction: column;
    margin-bottom: 16px;
  }
  .roadmap-title {
    font-size: 12px;
    font-weight: 700;
    text-align: center;
    color: var(--text-muted);
    letter-spacing: 0.02em;
    margin-bottom: 10px;
  }
  /* 상세 화면(manyfast 페이지11 구조) - 2026-08-04 재구성. */
  .step-detail-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .step-detail-nav-actions { display: flex; gap: 8px; }
  .step-detail-back {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }
  .step-detail-pill {
    background: none;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 14px;
    cursor: pointer;
  }
  .step-detail-pill:hover { background: var(--surface-2); }
  .step-detail-title {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-detail-status {
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
  }
  .step-detail-meta {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 24px;
  }
  .step-detail-section { margin-bottom: 28px; }
  .step-detail-columns {
    display: grid;
    grid-template-columns: 3fr 2fr;
    gap: 32px;
  }
  .step-checklist { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .step-checklist-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .step-checklist-item:last-child { border-bottom: none; }
  .step-checklist-item.muted { color: var(--text-muted); }
  .step-checklist-item input[type="checkbox"] {
    width: 14px;
    height: 14px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .step-checklist-bullet { flex-shrink: 0; font-weight: 700; }
  .step-checklist-item label { flex: 1; cursor: pointer; }
  .step-checklist-item span:nth-last-child(2) { flex: 1; }
  .step-checklist-tag {
    font-size: 11px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .step-doc-card, .step-agency-card {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  .step-detail-empty { font-size: 13px; color: var(--text-muted); }
  /* manyfast 참조 화면(페이지10)처럼 타임라인 레일ᆞ아코디언 없이 평평한
     카드 목록 - 카드 전체가 클릭 가능, hairline 구분선만 사용(2026-08-04,
     "박스 안의 박스 느낌 없애고 아코디언 삭제" 요청). */
  .roadmap-step {
    padding: 14px 4px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .roadmap-step:hover { background: var(--surface-2); }
  .roadmap-step-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
  }
  .roadmap-step-title { flex: 1; min-width: 0; }
  .roadmap-step-status-text {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .roadmap-step.current .roadmap-step-status-text { color: var(--accent); }
  .roadmap-step.done .roadmap-step-status-text { color: var(--done); }
  .roadmap-step-subtitle {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .roadmap-step-detail-link {
    display: block;
    margin-top: 6px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 12px;
    font-weight: 600;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .roadmap-parallel-badge {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .02em;
    padding: 1px 6px;
    border-radius: 999px;
    background: var(--surface-2);
    color: var(--text-muted);
  }
  /* 건축사 대행 여부 배지 - 대행 필요(needed)와 개인 직접 가능(diy)을 색으로 구분 */
  .roadmap-architect-badge {
    font-family: var(--mono);
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .02em;
    padding: 1px 6px;
    border-radius: 999px;
    margin-left: 4px;
  }
  .roadmap-architect-badge.needed { background: #fde8e8; color: #b42318; }
  @media (prefers-color-scheme: dark) {
    .roadmap-architect-badge.needed { background: #3a1a1a; color: #ff9a8f; }
  }
  .roadmap-parallel-cluster {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: 6px 0 0;
  }
  .roadmap-parallel-cluster.collapsed { display: none; }
  .roadmap-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text-muted);
  }
  .roadmap-chip.done {
    border-color: var(--done);
    background: color-mix(in srgb, var(--done) 10%, var(--panel));
    color: var(--done);
  }
  .roadmap-chip.checkable { cursor: pointer; }
  .roadmap-chip.checkable input[type="checkbox"] {
    width: 11px;
    height: 11px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .roadmap-substeps {
    list-style: none;
    margin: 5px 0 0;
    padding-left: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .roadmap-substeps.collapsed { display: none; }
  .roadmap-substep {
    font-size: 11px;
    color: var(--text-muted);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 5px;
  }
  .roadmap-substep.done { color: var(--text); }
  .roadmap-substep-icon { flex-shrink: 0; font-weight: 700; }
  .roadmap-substep-icon.done { color: var(--done); }
  .roadmap-substep.info { padding-left: 17px; opacity: 0.8; }
  /* case_facts에서 온 "확인된 사실"(임차인ᆞ용도지역ᆞ시설군 등) - 별도 줄로
     아래 나열하지 않고, 그 사실이 근거가 된 "허가ᆞ신고 대상 확인" 항목
     우측에 인라인 배지로 붙인다(2026-07-28 피드백: "체크한 항목 우측에"). */
  .roadmap-substep-tags {
    display: inline-flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-left: 2px;
  }
  .fact-tag-inline {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 7px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 9%, var(--panel));
    border: 1px solid color-mix(in srgb, var(--accent) 28%, var(--border));
    color: var(--text);
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
  }
  .roadmap-substep-fact-icon { flex-shrink: 0; font-size: 9px; }
  /* 사용자가 직접 완료를 표시할 수 있는 항목(task_progress 기반)만 실제
     체크박스 - 판정 축(permit/food/fire/signage)이 있는 항목은 시스템이
     확인한 사실이라 사용자가 임의로 못 바꾸게 readonly 아이콘 그대로 둔다. */
  .roadmap-substep.checkable { align-items: center; cursor: pointer; }
  .roadmap-substep.checkable input[type="checkbox"] {
    width: 12px;
    height: 12px;
    margin: 0;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  /* 선행조건이 있는 항목(사업자등록 등) - 조건 충족 전엔 흐리게+잠금
     아이콘으로 "아직 시작 못 함"을 표시한다. 이유는 title(네이티브 툴팁)로
     - 병렬 칩 클러스터는 한눈에 훑어보는 용도라 항상 보이는 텍스트를
     추가하면 오히려 어수선해진다(2026-07-28, Step3 사업자등록 - 임대차
     계약서ᆞ영업신고 확인 전에는 진행 불가).*/
  .roadmap-chip.locked, .roadmap-substep.locked {
    opacity: 0.55;
    cursor: help;
  }
  /* 해당없음(✕) - 대화로 필요 없다고 확인된 항목. 취소선+흐림으로 "닫힌" 느낌 */
  .roadmap-chip.na, .roadmap-substep.na {
    opacity: 0.5;
    text-decoration: line-through;
    text-decoration-color: var(--text-muted);
    cursor: help;
  }
  .roadmap-substep.na .roadmap-substep-icon { text-decoration: none; }
  .roadmap-step-note {
    margin: 4px 0 0;
    font-size: 10.5px;
    color: var(--text-muted);
  }

  .stage-caption {
    margin-top: 16px;
    font-size: 10px;
    color: var(--text-muted);
    text-align: center;
    line-height: 1.5;
  }
  @media (max-width: 900px) {
    /* 챗봇을 숨기지 않고 세로로 쌓는다 - 좁은 화면에서도 로드맵을 보면서
       계속 채팅할 수 있어야 한다("계속 연동" 요청, 2026-08-04). */
    .main-grid { grid-template-columns: 1fr; grid-template-rows: auto auto; }
    .app { height: 45vh; }
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .msg { display: flex; flex-direction: column; max-width: 85%; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.bot { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: 14px;
    white-space: pre-wrap;
    line-height: 1.5;
    font-size: 14px;
  }
  .msg.user .bubble {
    background: var(--accent);
    color: var(--accent-text);
    border-bottom-right-radius: 4px;
  }
  .msg.bot .bubble {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    border-bottom-left-radius: 4px;
  }
  /* 볼드(**강조**)가 그냥 굵기만 바뀌어서 잘 안 보인다는 피드백(2026-07-28) -
     색까지 넣어서 실제로 눈에 띄게. 사용자 말풍선은 이미 accent 배경이라
     굳이 색을 더 안 넣어도 되니 봇 말풍선에만 적용한다. */
  .msg.bot .bubble strong { color: #3b82f6; font-weight: 700; }
  .msg.bot .bubble.error {
    background: #fef2f2;
    color: var(--error);
  }
  .bubble ul, .bubble ol { margin: 4px 0; padding-left: 20px; }
  .bubble li { margin: 2px 0; }
  .bubble strong { font-weight: 700; }
  .bubble hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 8px 0;
  }
  .bubble .md-h1, .bubble .md-h2 { font-size: 1.1em; font-weight: 700; margin: 6px 0 4px; }
  .bubble .md-h3, .bubble .md-h4 { font-size: 1.03em; font-weight: 700; margin: 6px 0 4px; }
  .bubble .md-h5, .bubble .md-h6 { font-weight: 700; margin: 6px 0 4px; }
  .bubble code {
    background: rgba(0, 0, 0, 0.08);
    padding: 1px 5px;
    border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.9em;
  }
  @media (prefers-color-scheme: dark) {
    .bubble code { background: rgba(255, 255, 255, 0.12); }
  }
  .tool-tag {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 4px;
  }
  /* 법령 원문 카드 - [출처: ...] 인용의 실제 근거(law_contexts, GROUNDING_TOOL_NAMES
     도구 응답만)를 펼쳐서 보여준다. answer 텍스트를 그대로 믿지 말고 실제
     검색된 원문을 확인할 수 있게(2026-07-28, 시안 A 반영). */
  .law-card {
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
    padding: 8px 10px;
    margin-top: 6px;
    background: var(--panel);
    font-size: 12px;
  }
  .law-card summary {
    cursor: pointer;
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: .02em;
    color: var(--accent);
    font-weight: 700;
  }
  .law-card summary::-webkit-details-marker { display: none; }
  .law-card-body {
    margin: 8px 0 0;
    white-space: pre-wrap;
    line-height: 1.6;
    color: var(--text-muted);
    max-height: 240px;
    overflow-y: auto;
  }
  .typing { display: flex; gap: 4px; padding: 12px 14px; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--text-muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

  form#composer {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  #question {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    line-height: 1.4;
  }
  #question:focus { outline: none; border-color: var(--accent); }
  #sendBtn {
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    padding: 0 18px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }

  .empty-hint {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    font-size: 14px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c;
      --panel: #1f2126;
      --border: #2c2e34;
      --text: #e8e9ec;
      --text-muted: #9aa0a8;
      --bot-bubble: #2a2c32;
      --done: #60a5fa;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px rgba(0, 0, 0, .35);
      --surface-2: #26282f;
    }
    .msg.bot .bubble.error { background: #3a1f1f; }
  }
</style>
</head>
<body>
<div class="layout">
  <header>
    <div>
      <h1>서울시 창업 로드맵 어시스턴트</h1>
      <div class="header-tags" id="statusTags"></div>
    </div>
    <div class="header-right">
      <div class="sub" id="userIdLabel"></div>
      <a id="intakeLink" href="/ui/intake.html">📝 로드맵 만들기</a>
      <button id="newChatBtn" type="button">새 대화</button>
    </div>
  </header>

  <div class="next-action" id="nextAction"></div>

  <div class="main-grid">
    <div class="app">
      <div class="chat-panel-title">AI Assistant</div>
      <div id="chat">
        <div class="empty-hint" id="emptyHint">
          지역, 시설 유형, 규모를 알려주시면 인허가 절차를 안내해드려요.<br>
          예) "강남구에 20평 카페 창업하려는데 뭐부터 해야 해?"
        </div>
      </div>

      <form id="composer">
        <textarea id="question" rows="1" placeholder="질문을 입력하세요 (Enter로 전송, Shift+Enter로 줄바꿈)"></textarea>
        <button id="sendBtn" type="submit">전송</button>
      </form>
    </div>

    <aside class="side-panel">
      <div id="roadmapOverview">
        <div class="page-header">
          <h2>맞춤형 로드맵 결과</h2>
        </div>
        <div class="summary-card" id="summaryCard"></div>
        <div class="progress-card" id="progressCard"></div>
        <div class="next-step-card" id="nextStepCard"></div>
        <div class="side-panel-title">📍 전체 로드맵 단계</div>
        <div class="roadmap" id="roadmap"></div>
        <div class="stage-caption">✓ᆞ●는 시스템이 확인한 사실, 체크박스는 직접
          눌러서 진행상황을 표시할 수 있어요. 각 단계의 "상세보기"를 눌러 필요
          서류ᆞ절차를 확인하세요.<br>실제 절차는 사안에 따라 다를 수 있어
          참고용입니다.</div>
      </div>
      <div id="stepDetail" style="display: none;">
        <div class="step-detail-nav">
          <button type="button" id="stepDetailBack" class="step-detail-back">← 맞춤형 로드맵 결과로</button>
          <div class="step-detail-nav-actions">
            <button type="button" id="stepDocsNavBtn" class="step-detail-pill">문서 템플릿 목록</button>
            <button type="button" id="stepAskBtn" class="step-detail-pill">챗봇 Q&A</button>
          </div>
        </div>
        <div class="step-detail-title" id="stepDetailTitle"></div>
        <div class="step-detail-meta" id="stepDetailMeta"></div>

        <div class="step-detail-section">
          <div class="card-title">이 단계에서 해야 할 일</div>
          <div class="step-checklist" id="stepChecklist"></div>
        </div>

        <div class="step-detail-columns">
          <div class="step-detail-section">
            <div class="card-title">필요 서류</div>
            <div class="step-doc-list" id="stepDocs"></div>
          </div>
          <div class="step-detail-section">
            <div class="card-title">관련 기관 및 전문가</div>
            <div class="step-agency-list" id="stepAgencies"></div>
          </div>
        </div>
      </div>
    </aside>
  </div>
</div>

<script>
  const API_BASE = "";
  const chatEl = document.getElementById("chat");
  const emptyHint = document.getElementById("emptyHint");
  const form = document.getElementById("composer");
  const questionEl = document.getElementById("question");
  const sendBtn = document.getElementById("sendBtn");
  const userIdLabel = document.getElementById("userIdLabel");
  const newChatBtn = document.getElementById("newChatBtn");
  const roadmapEl = document.getElementById("roadmap");
  const nextActionEl = document.getElementById("nextAction");
  const statusTagsEl = document.getElementById("statusTags");
  const roadmapOverviewEl = document.getElementById("roadmapOverview");
  const summaryCardEl = document.getElementById("summaryCard");
  const progressCardEl = document.getElementById("progressCard");
  const nextStepCardEl = document.getElementById("nextStepCard");
  const stepDetailEl = document.getElementById("stepDetail");
  const stepDetailTitleEl = document.getElementById("stepDetailTitle");
  const stepDetailMetaEl = document.getElementById("stepDetailMeta");
  const stepChecklistEl = document.getElementById("stepChecklist");
  const stepDocsEl = document.getElementById("stepDocs");
  const stepAgenciesEl = document.getElementById("stepAgencies");
  const stepAskBtn = document.getElementById("stepAskBtn");
  const stepDocsNavBtn = document.getElementById("stepDocsNavBtn");
  const stepDetailBackBtn = document.getElementById("stepDetailBack");

  function getUserId() {
    let id = localStorage.getItem("permit_assistant_user_id");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("permit_assistant_user_id", id);
    }
    return id;
  }

  let userId = getUserId();
  userIdLabel.textContent = `세션: ${userId.slice(0, 8)}`;

  // record_case_facts로 이번 대화에서 확인된 사실들을 로드맵 상단에 태그로
  // 누적 표시(읽기 전용) - 사용자가 "내가 말한 게 이렇게 정리됐구나"를 실시간
  // 확인하고, 빠지거나 틀린 게 있으면 대화로 스스로 정정하도록 유도하는 용도.
  let caseFacts = {};
  let caseTypeResult = null; // set_procedure_stage로 확정된 허가/신고/기재변경 등
  let latestFoodResult = null; // /query 응답의 food_result(식품위생법상 영업 종류)를 그대로 보관
  let latestFireResult = null; // /query 응답의 fire_result(필요 소방시설 목록, 배열)를 그대로 보관
  let latestSignageResult = null; // /query 응답의 signage_result(간판ᆞ옥외광고물 허가/신고 판정)를 그대로 보관
  let taskProgress = {}; // /query 응답의 task_progress(사용자가 실제로 완료했다고 밝힌 항목)를 그대로 보관
  let requiresArchitect = null; // project_status.requires_architect(건축법 제23조 건축사 설계 의무 대상 여부). true=대행 필요, false=개인 직접 가능, null=정보부족. 백엔드 규칙 엔진 계산값을 그대로 보관(프론트에서 재계산 안 함)
  // case_facts엔 주소가 없다(record_case_facts 파라미터에 address가 없음) -
  // lookup_building_ledger/lookup_land_zone 호출 인자에서 가장 최근 주소를
  // 뽑아 프론트에서만 따로 들고 있는다(제목 아래 상황 태그 표시용,
  // 2026-07-28).
  let lastAddress = null;
  let bizType = null; // intake.html 1페이지에서 고른 업종(카페ᆞ음식점ᆞ사무실ᆞ기타) - "내 로드맵 요약" 카드 표시용
  let latestProjectStatus = null; // renderNextAction()이 매번 최신값을 보관 - 요약 카드가 같은 데이터를 다시 계산하지 않고 그대로 재사용
  let lastRoadmapSteps = []; // renderRoadmap()이 매번 새로 만드는 steps 배열의 최신 스냅샷 - showStepDetail()이 그 Step의 substeps(체크리스트 재료)를 다시 계산하지 않고 그대로 읽는다
  let lastRoadmapCurrentIdx = 0; // renderRoadmap()이 계산한 "지금 여기" Step 인덱스 - 상세 화면 상태 배지가 목록과 같은 판정을 쓰도록
  let openStepDetailIdx = null; // 지금 상세 화면에 열려있는 Step 인덱스(없으면 null) - 체크박스 토글로 renderRoadmap()이 다시 돌 때 상세 화면도 최신 상태로 다시 그리기 위함

  // case_facts 필드 → 태그 텍스트 변환. 여기 없는 필드는 태그로 안 보임(값
  // 하나만으로는 뜻이 안 통하는 필드는 아래에서 조합해서 별도 처리).
  const FACT_TAG_LABELS = {
    act_type: (v) => v,
    ownership: (v) => v,
    size_sqm: (v) => `연면적 ${v}㎡`,
    floors: (v) => `${v}층`,
    extension_size_sqm: (v) => `증축면적 ${v}㎡`,
    land_zone: (v) => v,
    renovation_scope: (v) => (v ? "대수선 해당" : "대수선 미해당"),
    temporary_purpose: (v) => v,
    temporary_duration_years: (v) => `존치 ${v}년`,
    temporary_is_concrete: (v) => (v ? "철근콘크리트조" : "비철콘크리트조"),
  };

  // src/agents/permit.py의 FACILITY_GROUPS 이름 부분만 미러링(번호→시설군
  // 이름) - 제목 아래 상황 태그에서 "용도변경(근린생활시설군 內)"처럼
  // 보여줄 때 쓴다. 세부 업종(제1종/제2종 등)까지는 case_facts에 없어서
  // 이 앱이 실제로 아는 만큼(시설군 단위)만 표시한다.
  const FACILITY_GROUP_NAMES = {
    1: "자동차 관련 시설군", 2: "산업 등 시설군", 3: "전기통신시설군",
    4: "문화집회시설군", 5: "영업시설군", 6: "교육 및 복지시설군",
    7: "근린생활시설군", 8: "주거업무시설군", 9: "그 밖의 시설군",
  };

  // 제목 아래 "지금 어떤 사안인지" 한 줄 요약(아티팩트 A 시안) - 업종ᆞ
  // 판정ᆞ주소 중 확보된 것만 이어붙인다. 로드맵 패널과 마찬가지로 여기서
  // 새로 판단하지 않고 이미 있는 상태(latestFoodResult/caseFacts/
  // lastAddress)만 반영한다.
  function renderStatusTags() {
    const parts = [];
    if (latestFoodResult && latestFoodResult !== "해당없음") parts.push(latestFoodResult);
    const actType = caseFacts.act_type;
    if (actType) {
      const groupName = FACILITY_GROUP_NAMES[caseFacts.desired_facility_group];
      parts.push(groupName ? `${actType}(${groupName} 內)` : actType);
    }
    if (lastAddress) parts.push(lastAddress);
    statusTagsEl.textContent = parts.join(" · ");
  }

  // "다음 할 일" 소요 기간 참고치 - 처음엔 로드맵 각 항목마다 배지로
  // 붙였는데 화면이 산만해진다는 피드백으로 걷어내고, 아티팩트 A 예시
  // ("...사용승인 신청 준비 (예상 3~5일)")처럼 히어로의 "다음 할 일" 한
  // 줄에만 붙인다(2026-07-28). project_status.py의 next_action은 고정된
  // 문자열 집합이라 그대로 키로 쓸 수 있다 - 법령상 처리기한이 있는 항목도,
  // 시공처럼 실무 관행으로만 알려진 항목도 섞여 있어 [출처] 없이 전부
  // 참고용 추정치로만 다룬다. 시간 폭으로 딱 떨어지지 않는 항목(소방시설
  // 확인 등)은 아예 표시하지 않는다.
  const NEXT_ACTION_DURATIONS = {
    "사전 검토": "3~7일",
    "설계ᆞ서류 준비": "1~2주",
    "신청ᆞ접수": "3~7일",
    "착공신고": "1~3일",
    "공사(시공)": "2~6주",
    "사용승인": "7일 이내",
    "식품위생 영업신고 확인": "3~5일",
    "간판ᆞ옥외광고물 확인": "3~10일",
    "사업자등록": "2~3일",
    "위생교육 이수": "1일",
    "인테리어ᆞ장비 설치": "2~6주",
    "직원 등록(4대보험 가입)": "당일",
  };

  // "허가ᆞ신고 대상 판정"만 예외 - 실제 확정된 종류(허가/신고/기재변경)에
  // 따라 기간이 크게 달라서 고정 문자열 하나로 못 뭉뚱그린다.
  function nextActionDuration(text) {
    if (text === "허가ᆞ신고 대상 판정") {
      const t = latestPermitResult?.permit_type || caseTypeResult || "";
      if (t.includes("기재변경")) return "3~7일";
      if (t.includes("허가")) return "15~20일";
      if (t.includes("신고")) return "3~5일";
      return null;
    }
    return NEXT_ACTION_DURATIONS[text] || null;
  }

  // "일ᆞ주ᆞ이내ᆞ당일" 등 자연어 기간 문자열을 [최소일, 최대일]로 변환한다.
  // Step 단위 "예상 준비 기간"ᆞ전체 소요기간 합산에 쓴다 - NEXT_ACTION_DURATIONS
  // 자체는 그대로(개별 substep 표시용), 여기서는 그 값들을 더하기 위해서만
  // 숫자로 바꾼다.
  function parseDurationDays(text) {
    if (!text) return [0, 0];
    let m = text.match(/(\d+)~(\d+)주/);
    if (m) return [Number(m[1]) * 7, Number(m[2]) * 7];
    m = text.match(/(\d+)~(\d+)일/);
    if (m) return [Number(m[1]), Number(m[2])];
    m = text.match(/(\d+)일\s*이내/);
    if (m) return [0, Number(m[1])];
    m = text.match(/(\d+)일/);
    if (m) return [Number(m[1]), Number(m[1])];
    if (text.includes("당일")) return [0, 0];
    return [0, 0];
  }

  function formatDurationDays([min, max]) {
    if (max === 0) return "당일";
    if (max <= 13) return min === max ? `${min}일` : `${min}~${max}일`;
    const wMin = Math.round(min / 7);
    const wMax = Math.round(max / 7);
    return wMin === wMax ? `${wMin}주` : `${wMin}~${wMax}주`;
  }

  // Step0~4 각각에 걸리는 NEXT_ACTION_DURATIONS 키 목록 - substep 텍스트를
  // 다시 파싱하는 대신, Step 구성 자체가 고정돼 있으니 그대로 표로 대응시킨다
  // (이 표의 키들은 renderRoadmap()의 steps[idx].substeps가 실제로 쓰는
  // 라벨과 항상 같은 값이어야 한다 - Step 구성을 바꾸면 이 표도 같이 고칠 것).
  // mode: "sum"(순차, 다 더함) | "max"(병렬, 가장 긴 것 하나로 대표).
  const STEP_DURATION_SPEC = [
    { keys: [], mode: "sum" }, // Step0: 유형ᆞ대상 판정 - 규칙 엔진이 즉시 계산, 별도 소요기간 없음
    { keys: ["사전 검토", "설계ᆞ서류 준비", "신청ᆞ접수"], mode: "sum" }, // Step1
    { keys: ["착공신고", "공사(시공)", "인테리어ᆞ장비 설치", "사용승인"], mode: "sum" }, // Step2
    { keys: ["식품위생 영업신고 확인", "간판ᆞ옥외광고물 확인", "사업자등록", "위생교육 이수"], mode: "max" }, // Step3(병렬)
    { keys: ["직원 등록(4대보험 가입)"], mode: "sum" }, // Step4
  ];

  function stepDurationDays(idx) {
    const spec = STEP_DURATION_SPEC[idx];
    if (!spec || !spec.keys.length) return [0, 0];
    const days = spec.keys.map((k) => parseDurationDays(NEXT_ACTION_DURATIONS[k]));
    if (spec.mode === "max") {
      return [Math.max(...days.map((d) => d[0])), Math.max(...days.map((d) => d[1]))];
    }
    return [days.reduce((a, d) => a + d[0], 0), days.reduce((a, d) => a + d[1], 0)];
  }

  // 케이스 유형과 무관하게 공통인 0~4단계 진행 판단. 이전엔 봇 답변 텍스트에서
  // "[1단계]"~"[4단계]" 헤더를 감지해서 단계를 올렸는데, LLM이 정보가 충분하면
  // 한 턴에 1~4단계를 몰아서 다 써버리는 경우가 실제로 많아 곧장 완료로
  // 잘못 판정되는 문제가 있었다(2026-07-24 실측). 대신 각 단계마다 실제로
  // 채워져야 하는 구조화 데이터(case_facts, permit_result의 required_documents/
  // pre_diagnosis_items)를 체크리스트로 만들고, 그 리스트가 전부(또는 최소
  // 1개 이상) 채워져야만 다음 단계로 넘어가게 한다 - 텍스트 분량과 무관하게
  // 실제로 그 단계에 필요한 정보가 기록됐는지만 본다. (예전엔 이 값을 별도
  // 고도계 UI로 보여줬는데, 로드맵의 Step 1과 내용이 그대로 겹쳐서
  // 2026-07-27에 로드맵 Step 1 안으로 통합했다.)

  // src/agents/permit.py의 REQUIRED_FIELDS를 그대로 미러링(행위 유형별로
  // 판정에 필요한 사실 목록) - 0단계 체크리스트를 만드는 데 사용.
  const REQUIRED_FIELDS = {
    "신축": ["size_sqm", "floors", "land_zone"],
    "증축": ["extension_size_sqm"],
    "개축": ["extension_size_sqm"],
    "재축": ["extension_size_sqm"],
    "이전": [],
    "대수선": ["renovation_scope", "size_sqm", "floors"],
    "용도변경": ["current_facility_group", "desired_facility_group"],
    "일반수선": [],
    "가설건축물": ["temporary_purpose", "temporary_duration_years", "temporary_is_concrete"],
  };

  let latestPermitResult = null; // /query 응답의 permit_result를 그대로 보관(백엔드가 이미 결정론적으로 계산한 값)

  // 각 단계의 체크리스트 + 완료 여부를 case_facts/permit_result 같은 실제
  // 데이터에서 뽑아낸다. 여기서 "done"으로 계산된 것 외에는 아무것도 지어내지
  // 않는다(도구 호출 없이 텍스트만 보고 단계를 올리는 일이 없도록).
  function buildChecklists() {
    const actType = caseFacts.act_type;
    const classified = !!(latestPermitResult && latestPermitResult.permit_type);

    const stage0Items = actType
      ? (REQUIRED_FIELDS[actType] || []).map(f => ({
          text: FACT_TAG_LABELS[f] ? FACT_TAG_LABELS[f](caseFacts[f]) : f,
          done: caseFacts[f] != null,
        }))
      : [{ text: "신축ᆞ증축ᆞ용도변경 등 행위 유형 파악", done: false }];

    const stage1Items = [{ text: "허가ᆞ신고ᆞ기재변경 여부 판정", done: classified }];

    const diag = latestPermitResult?.pre_diagnosis_items || [];
    const stage2Items = diag.length
      ? diag.map(d => ({ text: d, done: true }))
      : [{ text: "사전 검토 확인 중", done: false }];

    const docs = latestPermitResult?.required_documents || [];
    const stage3Items = docs.length
      ? docs.map(d => ({ text: d, done: true }))
      : [{ text: "설계ᆞ서류 준비 안내 대기 중", done: false }];

    return [
      { items: stage0Items, done: classified },
      { items: stage1Items, done: classified },
      { items: stage2Items, done: diag.length > 0 },
      { items: stage3Items, done: docs.length > 0 },
    ];
  }

  // 앞에서부터 연속으로 done인 단계 수 = 현재 단계(0~4). 중간에 하나라도
  // 안 끝났으면 그 이후는 절대 먼저 완료로 안 침(순서 보장).
  function computeCurrentStage(checklists) {
    let stage = 0;
    for (const c of checklists) {
      if (!c.done) break;
      stage += 1;
    }
    return stage;
  }

  // 사용자가 로드맵 체크박스를 직접 클릭했을 때 - 낙관적으로 먼저 반영하고
  // (즉시 반응), /task-progress로 그래프 상태에도 저장한다. 실패하면 되돌려서
  // 화면과 실제 저장 상태가 어긋나지 않게 한다.
  async function toggleTaskProgress(field, value) {
    const previous = taskProgress[field];
    taskProgress = { ...taskProgress, [field]: value };
    localStorage.setItem("permit_assistant_task_progress", JSON.stringify(taskProgress));
    renderRoadmap();
    try {
      const res = await fetch(`${API_BASE}/task-progress`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: userId, field, value }),
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      taskProgress = data.task_progress;
    } catch (err) {
      console.error("진행상황 저장 실패:", err);
      taskProgress = { ...taskProgress, [field]: previous };
    }
    localStorage.setItem("permit_assistant_task_progress", JSON.stringify(taskProgress));
    renderRoadmap();
  }

  // 전체 창업 로드맵(Step 0~4) 요약 - 판정(permit_result/food_result/
  // fire_result/signage_result)이 난 항목과 사용자가 완료를 직접 말한 항목
  // (task_progress)만 체크한다. 판정 축 항목은 시스템이 근거를 갖고 확인한
  // 사실이라 체크박스 없이 아이콘만(사용자가 임의로 못 뒤집게), task_progress
  // 축 항목만 실제 체크박스(field 지정)로 사용자가 직접 토글 가능하다.
  function renderRoadmap() {
    renderStatusTags();
    const actType = caseFacts.act_type;
    // buildChecklists() 안의 동일 정의(801행)와 같은 기준 - 판정(permit_type)이
    // 나왔는지 여부. Step0의 두 번째 substep(대상 판정) done 여부로 쓴다.
    const classified = !!(latestPermitResult && latestPermitResult.permit_type);
    const checklists = buildChecklists();
    const permitStage = computeCurrentStage(checklists);
    const docs = latestPermitResult?.required_documents || [];
    const diag = latestPermitResult?.pre_diagnosis_items || [];

    // 확인된 사실(case_facts)은 별도 "하위 태그" 줄로 떼어 보여주지 않고,
    // 그 사실이 실제로 쓰인 Step 안에 바로 넣는다 - act_type은 Step0
    // substep 자체가 이미 보여주고 있으니(아래), 나머지(소유여부ᆞ연면적ᆞ
    // 용도지역ᆞ시설군 등 판정 입력값)는 Step1 안에 참고용 줄로 넣는다
    // (2026-07-28 논의: "체킹된 내용은 해당 Step 안에").
    const factInfoLines = [];
    for (const [key, value] of Object.entries(caseFacts)) {
      if (value == null || key === "_classified" || key === "act_type") continue;
      if (key === "current_facility_group" || key === "desired_facility_group") continue;
      const fmt = FACT_TAG_LABELS[key];
      if (fmt) factInfoLines.push(fmt(value));
    }
    if (caseFacts.current_facility_group != null && caseFacts.desired_facility_group != null) {
      factInfoLines.push(`시설군 ${caseFacts.current_facility_group}→${caseFacts.desired_facility_group}`);
    }

    // Step 1의 사전진단ᆞ서류는 판정이 나오면 실제 항목명을 그대로 보여준다
    // (예전 고도계가 보여주던 상세 정보 - 요약 라벨로 뭉개면 정보 손실).
    // 단, 항목이 "나열됐다"는 것과 "완료됐다"는 것은 다르다 - AI가 사전진단ᆞ
    // 서류 항목을 설명만 했는데 전부 done:true로 표시돼 Step1이 실제로는
    // 아무것도 확인 안 된 채로 통째로 체크되는 회귀 버그가 있었다(2026-07-27).
    // 그래서 실제 항목 목록은 info(참고용, 체크 여부 없음)로만 보여주고,
    // 완료 여부는 사용자가 직접 확인한 task_progress 체크박스 하나로만 반영한다.
    // 판정이 "인허가불필요"면 사전 검토ᆞ서류 준비ᆞ신청 접수 자체가 불필요하다
    // - ✕로 닫는다. (2026-08-03: 실제 업무 순서(사전검토→서류준비→신청접수)를
    // 반영해 재배치 - 사전진단 결과가 설계도서에 반영돼야 하므로 서류 준비보다
    // 먼저다. "신청서 제출"에 뭉쳐 있던 서류 준비ᆞ접수 행위도 별도 항목으로
    // 분리했다.)
    const permitNotNeeded = (latestPermitResult?.permit_type || caseTypeResult) === "인허가불필요";
    const step1Substeps = [];
    if (factInfoLines.length) {
      // 판정 입력값(연면적ᆞ용도지역 등 참고 정보)은 Step0로 옮긴 판정 항목이
      // 아니라 별도 참고 줄로 유지 - 첫 substep으로 안 넣고 info 줄로만.
      step1Substeps.push({ text: factInfoLines.join(" · "), info: true });
    }
    if (diag.length) {
      diag.forEach((d) => step1Substeps.push({ text: `🔍 ${d}`, info: true }));
      step1Substeps.push({ text: "사전 검토 확인 완료", done: !!taskProgress.pre_diagnosis_checked, field: "pre_diagnosis_checked" });
    } else {
      step1Substeps.push({ text: "사전 검토", done: false, notApplicable: permitNotNeeded, naReason: "인허가 대상이 아니라 사전 검토가 필요 없습니다" });
    }
    if (docs.length) {
      docs.forEach((d) => step1Substeps.push({ text: `📄 ${d}`, info: true }));
      step1Substeps.push({ text: "설계ᆞ서류 준비", done: !!taskProgress.documents_prepared, field: "documents_prepared" });
    } else {
      step1Substeps.push({ text: "설계ᆞ서류 준비", done: false, notApplicable: permitNotNeeded, naReason: "이 행위는 건축 인허가(신고ᆞ허가) 대상이 아닙니다" });
    }
    step1Substeps.push({
      text: "신청ᆞ접수",
      done: !!taskProgress.application_submitted,
      field: "application_submitted",
      notApplicable: permitNotNeeded,
      naReason: "이 행위는 건축 인허가(신고ᆞ허가) 대상이 아닙니다",
    });

    // Step 4 "영업 시작" 잠금 기준 - 소방시설은 Step2로 옮겨갔으므로
    // step3AllDone에서 제외(이중 게이트 방지, 2026-08-04). 나머지 4항목
    // (식품위생ᆞ간판ᆞ사업자등록ᆞ위생교육)은 그대로.
    const step3AllDone = latestFoodResult != null
      && latestSignageResult != null
      && !!taskProgress.business_registration
      && !!taskProgress.hygiene_education;

    const steps = [
      {
        // Step0은 원래 행위 유형 파악 1개 substep이었는데, 대상 판정
        // (허가ᆞ신고ᆞ기재변경 여부)도 여기로 옮겨왔다(2026-08-04) - Step1의
        // 첫 항목이 "대상 확인"이었던 걸 없애고, 개념적으로 "판정은 Step0,
        // 그 이후 실무는 Step1"로 재배치.
        title: "Step 0 · 건축 유형 + 대상 판정",
        substeps: [
          { text: actType || "행위 유형 파악", done: !!actType },
          {
            text: latestPermitResult ? `판정: ${latestPermitResult.permit_type}` : (caseTypeResult ? `판정: ${caseTypeResult}` : "허가ᆞ신고ᆞ기재변경 대상 판정"),
            done: classified,
          },
        ],
        // 건축법 제23조: 이 케이스가 건축사사무소 설계 의무 대상인지(백엔드
        // requires_licensed_architect 계산값). true=대행 필요, false=개인 직접
        // 가능. null(정보부족)이면 배지를 아예 안 보여준다. 판정 축이 Step0로
        // 옮겨오면서 배지도 Step0로 함께 옮겼다(2026-08-04).
        architect: requiresArchitect,
      },
      {
        title: "Step 1 · 건축 인허가 실무",
        substeps: step1Substeps,
      },
      {
        title: "Step 2 · 공사",
        // 인테리어ᆞ장비 설치는 원래 Step4(오픈 준비)에 있었는데, 실제로는
        // "시공"의 일부라 공사 단계 안에 있는 게 더 정확하다는 피드백으로
        // 이동(2026-07-28) - get_construction_guide가 시공 전 건축사사무소
        // 선정 필요 여부까지 같이 안내하니 이 Step 전체가 "공사 실행에
        // 필요한 것"으로 일관된다. 소방시설은 실제 설치ᆞ확인이 시공의
        // 일부라 Step3(창업 행정)에서 여기로 옮겨왔다(2026-08-04).
        substeps: [
          {
            text: "착공신고", done: !!taskProgress.construction_notice, field: "construction_notice",
            // 구조 공사 없이 인테리어만 하는 경우 착공신고 자체가 대상이 아니다.
            notApplicable: !!taskProgress.interior_only,
            naReason: "구조 공사 없이 인테리어만 진행하는 경우라 착공신고 대상이 아닙니다",
          },
          {
            text: "시공", done: !!taskProgress.construction, field: "construction",
            notApplicable: !!taskProgress.interior_only,
            naReason: "구조 공사 없이 인테리어만 진행하는 경우라 해당 없습니다",
          },
          {
            text: latestFireResult && latestFireResult.length ? `소방시설: ${latestFireResult.join("ᆞ")}` : "소방시설",
            done: latestFireResult != null,
            // 연면적 기준상 설치할 소방시설이 없으면(빈 배열) ✕로 닫는다.
            notApplicable: Array.isArray(latestFireResult) && latestFireResult.length === 0,
            naReason: "연면적 기준상 설치 대상 소방시설이 없습니다",
            // interior_only 케이스는 construction이 계속 false로 남을 수
            // 있어(구조 공사 자체가 없으니) construction만으로 잠그면
            // 영원히 안 풀린다 - interior_only면 잠금 조건에서 제외.
            locked: !taskProgress.construction && !taskProgress.interior_only,
            lockReason: "공사(시공) 완료 후 설치ᆞ확인 가능",
          },
          { text: "인테리어ᆞ장비 설치", done: !!taskProgress.interior_equipment, field: "interior_equipment" },
          { text: "사용승인", done: !!taskProgress.use_approval, field: "use_approval" },
        ],
      },
      {
        title: "Step 3 · 창업 행정",
        // 이 항목들은 건축 트랙(Step 0~2)과 무관하게 병렬로 진행 가능하다
        // (예: 인허가 얘기 전에 식품위생부터 판정나는 실제 사례가 흔함) -
        // 세로 목록 대신 나란한 칩 클러스터로 렌더링해서 "동시에 진행되는
        // 여러 일"이라는 게 시각적으로도 드러나게 한다(2026-07-28, 시안 A2).
        parallel: true,
        // 판정 결과(제과점영업/신고 등 실제 값)도 별도 태그가 아니라 그
        // 항목 라벨 자체에 바로 넣는다 - 판정 전엔 일반 라벨, 판정 후엔
        // 실제 값으로 텍스트가 바뀐다(2026-07-28).
        substeps: [
          // 식품위생 영업신고는 "어떤 종류인지 판정"은 사용승인 전에도 할 수
          // 있지만, 실제 신고 접수는 건물이 적법하게 사용 가능한 상태(사용승인
          // 완료)여야 가능하다(2026-07-28 피드백). 그래서 판정 자체는 그대로
          // 라벨에 보여주되(done 여부와 무관하게 잠금), 사용승인 전까지는
          // 🔒로 표시해 "신고까지는 아직" 임을 나타낸다.
          {
            text: latestFoodResult ? `식품위생: ${latestFoodResult}` : "식품위생 영업신고",
            done: latestFoodResult != null,
            // 대화로 "식품위생법 비대상"이 확정되면(해당없음ᆞ완제품 소매 신고대상제외)
            // 신고 자체가 필요 없으니 ✕로 닫는다.
            notApplicable: latestFoodResult === "해당없음" || latestFoodResult === "신고대상제외",
            naReason: "식품위생법상 별도 영업신고 대상이 아닙니다",
            locked: !taskProgress.use_approval,
            lockReason: "사용승인 완료 후 신고 가능",
          },
          {
            text: latestSignageResult ? `간판: ${latestSignageResult}` : "간판ᆞ옥외광고물",
            done: latestSignageResult != null,
            // 허가ᆞ신고가 필요 없는 간판이면 ✕로 닫는다.
            notApplicable: latestSignageResult != null && latestSignageResult.includes("불필요"),
            naReason: "허가ᆞ신고가 필요 없는 간판입니다",
            // interior_only 케이스는 construction이 계속 false로 남을 수
            // 있어(구조 공사 자체가 없으니) construction만으로 잠그면
            // 영원히 안 풀린다 - interior_only면 잠금 조건에서 제외.
            locked: !taskProgress.construction && !taskProgress.interior_only,
            lockReason: "공사(시공) 완료 후 설치 가능",
          },
          // 사업자등록은 다른 Step3 항목과 달리 "아무 때나 시작 가능"이
          // 아니다 - 실제로는 임대차계약서(임차인 서류, Step1
          // documents_prepared에 포함) + 영업신고 종류 판정(식품위생법상
          // 대상 여부까지 확정)이 나온 뒤에야 진행 가능하다(2026-07-28
          // 피드백: "임대차계약서ᆞ영업신고 나온 후에 진행할 수 있으니까").
          // 전체를 다른 lane으로 그리는 대신 잠금 배지로 표시 - 로드맵이
          // flex 레이아웃이라 SVG 분기선을 새로 그리는 것보다 훨씬 단순하게
          // 같은 의미(아직 시작 불가)를 전달한다.
          {
            text: "사업자등록",
            done: !!taskProgress.business_registration,
            field: "business_registration",
            // 인허가불필요 케이스(예: 일반수선)는 서류 준비 자체가 없어
            // documents_prepared가 영원히 안 채워진다 - permitNotNeeded면
            // 그 substep을 이미 통과(notApplicable)로 보는 것과 같은 기준으로
            // 여기서도 통과 처리해야 잠금이 영구히 안 풀리는 버그가 없다
            // (2026-08-04, 사용승인까지 끝났는데 Lock이 안 풀린다는 신고).
            locked: !((taskProgress.documents_prepared || permitNotNeeded) && latestFoodResult != null),
            lockReason: "임대차계약서ᆞ영업신고 확인 후 진행 가능",
          },
          {
            text: "위생교육",
            done: !!taskProgress.hygiene_education,
            field: "hygiene_education",
            // 위생교육 의무는 식품위생법상 영업자ᆞ종업원 대상 - 식품위생법
            // 비대상이 확정되면(해당없음ᆞ완제품 소매 신고대상제외) 위생교육도
            // 대상이 아니다(식품위생 항목과 동일 판정 기준 재사용).
            notApplicable: latestFoodResult === "해당없음" || latestFoodResult === "신고대상제외",
            naReason: "식품위생법상 영업자가 아니라 위생교육 대상이 아닙니다",
          },
        ],
      },
      {
        title: "Step 4 · 오픈 준비",
        substeps: [
          // 1인ᆞ가족 운영이라 직원을 안 두면(hires_staff=False) 4대보험
          // 가입 신고 자체가 대상이 아니다 - 계속 미완료로 남아 진행률이
          // 100%를 못 채우는 문제가 있었다(2026-07-28, project_status.py와
          // 동일 기준).
          // 직원 등록(4대보험 가입)은 실제 채용ᆞ근무 시작 시점에 하는
          // 절차라, 최소한 사업자등록이 끝난 뒤에나 진행 가능하다(2026-07-28
          // 확인). hires_staff=false(직원 없음)로 이미 done인 경우는 기존
          // 잠금 분기(sub.locked && !sub.done)가 자동으로 잠그지 않는다.
          {
            text: "직원 등록(4대보험 가입)",
            done: !!taskProgress.staff_registration || taskProgress.hires_staff === false,
            // 직원을 안 두면(1인ᆞ가족 운영) 4대보험 가입 대상이 아니라 ✕로 닫는다.
            notApplicable: taskProgress.hires_staff === false,
            naReason: "직원을 두지 않아 4대보험 가입 대상이 아닙니다",
            field: "staff_registration",
            locked: !taskProgress.business_registration,
            lockReason: "사업자등록 완료 후 진행 가능",
          },
          // 영업 시작은 로드맵의 마지막 관문 - Step3(식품위생ᆞ간판ᆞ사업자등록ᆞ
          // 위생교육)가 전부 끝나야 실제로 열 수 있다(2026-07-28). 소방시설은
          // Step2로 옮겨가서 이 게이트에서 빠졌다(2026-08-04, step3AllDone 참고).
          {
            text: "영업 시작",
            done: !!taskProgress.opened,
            field: "opened",
            locked: !step3AllDone,
            lockReason: "식품위생ᆞ간판ᆞ사업자등록ᆞ위생교육 완료 후 가능",
          },
        ],
      },
    ];
    lastRoadmapSteps = steps;

    // 도메인(식품위생ᆞ소방ᆞ간판 등)은 실제로 서로 독립적이라 대화 순서에
    // 따라 Step 0~2가 텅 빈 채로 Step 3의 일부 항목만 먼저 판정날 수 있다
    // (예: 인허가 얘기 전에 빵집 얘기부터 하면 food_result가 먼저 참). 이걸
    // Step마다 따로 "진행중(파란 점멸)"으로 표시하면 여러 곳이 동시에
    // 반짝여서 로드맵을 따라 순서대로 내려가는 느낌이 끊긴다는 피드백
    // (2026-07-27)이 있어 - "지금 여기" 하이라이트는 앞에서부터 순서대로
    // 처음 안 끝난 단계 딱 하나에만 주고, 순서를 벗어나 먼저 확인된 항목은
    // 서브스텝 체크는 그대로 살리되(정보 손실 없이) 단계 전체를 반짝이게
    // 하진 않는다.
    // info 항목(서류ᆞ사전진단 실제 목록처럼 참고용으로만 보여주는 줄)은
    // 완료 여부 개념이 없으니 done/total 집계에서 제외한다 - 안 그러면
    // "나열됨"이 "완료됨"으로 잘못 집계되는 문제가 재발한다.
    const countable = (step) => step.substeps.filter((s) => !s.info);
    let currentIdx = steps.findIndex((step) => {
      const items = countable(step);
      const doneCount = items.filter((s) => s.done).length;
      return doneCount < items.length;
    });
    if (currentIdx === -1) currentIdx = steps.length;
    lastRoadmapCurrentIdx = currentIdx; // showStepDetail()이 개요와 같은 "진행 중" 판정을 쓰도록

    // manyfast 참조 화면(페이지10)처럼 아코디언ᆞ타임라인 레일ᆞ체크박스
    // 없이 평평한 카드 목록만 그린다(2026-08-04) - 체크박스는 상세 화면
    // (showStepDetail)으로 옮겼다. 카드 전체가 클릭 가능해서 어느 지점을
    // 눌러도 상세로 이동한다.
    roadmapEl.innerHTML = "";
    steps.forEach((step, idx) => {
      const items = countable(step);
      const doneCount = items.filter((s) => s.done).length;
      const total = items.length;
      const allDone = doneCount === total;
      const hasProgress = doneCount > 0 && !allDone;
      const isCurrent = idx === currentIdx && !allDone;

      const stepEl = document.createElement("div");
      stepEl.className = "roadmap-step" + (allDone ? " done" : "") + (isCurrent ? " current" : "");
      stepEl.addEventListener("click", () => showStepDetail(idx, step.title));

      const head = document.createElement("div");
      head.className = "roadmap-step-head";
      const parallelBadge = step.parallel ? `<span class="roadmap-parallel-badge">병렬 가능</span>` : "";
      // 건축사 대행 배지(Step 1) - 건축사 설계가 필수인 경우(true)에만 표시한다.
      // "개인 직접 가능"(false)은 채팅 안내에서 실무 뉘앙스와 함께 설명하므로
      // UI 배지로 중복 표기하지 않는다. null(정보부족)도 배지 없음.
      const architectBadge = step.architect === true
        ? `<span class="roadmap-architect-badge needed" title="건축법 제23조: 건축사 설계 의무 대상">🏛 건축사사무소 대행</span>`
        : "";
      const statusWord = allDone ? "완료" : (isCurrent || hasProgress) ? "진행 중" : "대기";
      head.innerHTML = `<span class="roadmap-step-title">${step.title}</span>${parallelBadge}${architectBadge}<span class="roadmap-step-status-text">${statusWord}</span>`;
      stepEl.appendChild(head);

      // 한 줄 부제 - substep 텍스트를 이어붙인다(체크박스ᆞ정보줄 구분 없이
      // 요약만, 참조 이미지의 "용도변경 허가 대상 확인 · 건폐율ᆞ용적률 검토"
      // 같은 한 줄 설명과 동일한 역할).
      const subtitle = document.createElement("div");
      subtitle.className = "roadmap-step-subtitle";
      subtitle.textContent = step.substeps.map((s) => s.text).join(" ᆞ ");
      stepEl.appendChild(subtitle);

      // 지금 단계(진행 중)에만 참조 이미지처럼 별도 텍스트 링크를 보여준다 -
      // 나머지는 카드 전체 클릭으로 충분(위 stepEl 클릭 핸들러).
      if (isCurrent) {
        const link = document.createElement("button");
        link.type = "button";
        link.className = "roadmap-step-detail-link";
        link.textContent = "단계 상세보기";
        link.addEventListener("click", (e) => {
          e.stopPropagation();
          showStepDetail(idx, step.title);
        });
        stepEl.appendChild(link);
      }

      roadmapEl.appendChild(stepEl);
    });

    renderSummaryCards(steps, countable, currentIdx);

    // 체크박스를 상세 화면에서 눌렀을 때도 그 화면이 최신 상태(상태 배지ᆞ
    // 체크 표시)로 다시 그려지도록 - renderRoadmap()은 #roadmap(개요)만
    // 다시 그리므로, 상세 화면이 열려 있으면 그것도 같이 갱신한다.
    if (openStepDetailIdx !== null && lastRoadmapSteps[openStepDetailIdx]) {
      renderStepDetail(openStepDetailIdx, lastRoadmapSteps[openStepDetailIdx].title);
    }
  }

  // 개요 화면 상단 3개 카드("내 로드맵 요약"ᆞ"전체 진행률"ᆞ"다음에 해야 할
  // 단계") - renderRoadmap()이 이미 계산한 steps/currentIdx를 그대로
  // 받아써서 같은 판정을 두 번 하지 않는다(로드맵 목록과 다른 숫자를
  // 말하면 안 된다는 기존 원칙, renderNextAction 주석 참고).
  function renderSummaryCards(steps, countable, currentIdx) {
    // 요약 카드
    const bizTypeLabel = bizType || "업종 미입력";
    const addressLabel = lastAddress || "주소 미입력";
    const actTypeLabel = caseTypeResult || caseFacts.act_type || "판정 전";
    let totalMin = 0, totalMax = 0;
    [0, 1, 2, 4].forEach((idx) => {
      const [min, max] = stepDurationDays(idx);
      totalMin += min;
      totalMax += max;
    });
    summaryCardEl.innerHTML = `
      <div class="card-title">내 로드맵 요약</div>
      <div class="summary-grid">
        <div><span class="summary-label">업종</span><span class="summary-value">${bizTypeLabel}</span></div>
        <div><span class="summary-label">주소</span><span class="summary-value">${addressLabel}</span></div>
        <div><span class="summary-label">건축 유형</span><span class="summary-value">${actTypeLabel}</span></div>
        <div><span class="summary-label">관할 기관</span><span class="summary-value">관할 시ᆞ군ᆞ구청 건축과</span></div>
        <div><span class="summary-label">예상 총 소요기간</span><span class="summary-value">약 ${formatDurationDays([totalMin, totalMax])}(창업 준비 병행 가능)</span></div>
      </div>
      <div class="summary-notice">⚠ 참고용 추정치입니다 - 관할 기관에서 최종 확인하세요.</div>
    `;

    // 진행률 카드 - Step 5개 기준 완료ᆞ진행중ᆞ대기 집계(전체 %는 project_status.progress를 그대로 씀).
    let done = 0, inProgress = 0, waiting = 0;
    steps.forEach((step, idx) => {
      const items = countable(step);
      const doneCount = items.filter((s) => s.done).length;
      if (items.length > 0 && doneCount === items.length) done++;
      else if (doneCount > 0 || idx === currentIdx) inProgress++;
      else waiting++;
    });
    const pct = latestProjectStatus?.progress ?? 0;
    progressCardEl.innerHTML = `
      <div class="card-title">전체 진행률</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="progress-pct">${pct}%</div>
      <div class="progress-stats">
        <div><span class="stat-num">${done}</span><span class="stat-label">완료</span></div>
        <div><span class="stat-num">${inProgress}</span><span class="stat-label">진행 중</span></div>
        <div><span class="stat-num">${waiting}</span><span class="stat-label">대기</span></div>
      </div>
    `;

    // 다음에 해야 할 단계 카드 - project_status의 트랙별 next_action을 그대로 반영만.
    const tracks = latestProjectStatus
      ? [latestProjectStatus.construction_track, latestProjectStatus.startup_track].filter((t) => t?.next_action)
      : [];
    if (tracks.length) {
      const next = tracks[0];
      nextStepCardEl.innerHTML = `
        <div class="card-title">다음에 해야 할 단계</div>
        <div class="next-step-body">
          <div class="next-step-text">${next.next_action}</div>
          <button type="button" class="next-step-btn" id="nextStepDetailBtn">상세보기</button>
        </div>
      `;
      document.getElementById("nextStepDetailBtn").addEventListener("click", () => {
        showStepDetail(currentIdx < steps.length ? currentIdx : 0, steps[currentIdx < steps.length ? currentIdx : 0]?.title || "");
      });
    } else {
      nextStepCardEl.innerHTML = `
        <div class="card-title">다음에 해야 할 단계</div>
        <div class="next-step-body">🎉 모든 절차를 완료했어요!</div>
      `;
    }
  }

  // /project-status(또는 /query 응답에 같이 오는 project_status)를 그대로
  // 반영만 한다 - 진행률ᆞ현재 단계ᆞ다음 할 일을 여기서 새로 판단하지 않는다
  // (로드맵 패널과 서로 다른 숫자를 말하면 신뢰가 깨진다, 2026-07-28 논의:
  // "같은 데이터를 다르게 보여주는 문제"가 되도록 단일 소스만 쓰기로 함).
  // 건축 트랙ᆞ창업 준비 트랙을 각각 따로 보여준다 - 예전엔 Step 0~4를 한
  // 줄로만 훑어서 "현재 단계" 하나만 말했는데, 두 트랙이 실제로는 병렬로
  // 진행돼서(예: 인허가 판정 전에 식품위생부터 끝나는 경우) 위젯이 계속
  // "Step1"이라고만 말하는 문제가 있었다(실사용 세션 79430043, 2026-07-28
  // 확인). compute_project_status()가 이미 트랙별로 나눠 계산해주니 그대로
  // 반영만 한다.
  function renderNextAction(status) {
    latestProjectStatus = status; // renderSummaryCards()가 재계산 없이 재사용
    if (!status) { nextActionEl.innerHTML = ""; return; }
    const pct = status.progress ?? 0;
    const tracks = [
      { label: "건축", data: status.construction_track },
      { label: "창업 준비", data: status.startup_track },
    ];
    // 트랙이 2개(건축ᆞ창업 준비)라도 아티팩트 A 예시처럼 한 줄로 합쳐
    // 보여준다 - "다음 할 일 — {트랙}: {행동}(예상 O~O일) · ..."(2026-07-28
    // 피드백: "2개라도 한 줄로 표기해줘" + "소요 예상시간을 다음 할 일에").
    const trackParts = tracks
      .filter((t) => t.data && t.data.next_action)
      .map((t) => {
        const dur = nextActionDuration(t.data.next_action);
        return `${t.label}: <strong>${t.data.next_action}</strong>${dur ? ` (예상 ${dur})` : ""}`;
      });
    const headline = trackParts.length
      ? `👉 다음 할 일 — ${trackParts.join(" · ")}`
      : "🎉 모든 절차를 완료했어요!";
    nextActionEl.innerHTML = `
      <div class="next-action-pct">${pct}%</div>
      <div class="next-action-body">
        <div class="next-action-progress">
          <div class="next-action-bar"><div class="next-action-fill" style="width:${pct}%"></div></div>
        </div>
        <div class="next-action-headline">${headline}</div>
      </div>
    `;
  }

  function restoreStageIndicator() {
    const savedFacts = localStorage.getItem("permit_assistant_case_facts");
    if (savedFacts) {
      try { caseFacts = JSON.parse(savedFacts); } catch (err) { caseFacts = {}; }
    }
    const savedPermitResult = localStorage.getItem("permit_assistant_permit_result");
    if (savedPermitResult) {
      try { latestPermitResult = JSON.parse(savedPermitResult); } catch (err) { latestPermitResult = null; }
    }
    caseTypeResult = localStorage.getItem("permit_assistant_case_type");
    latestFoodResult = localStorage.getItem("permit_assistant_food_result");
    const savedFireResult = localStorage.getItem("permit_assistant_fire_result");
    if (savedFireResult) {
      try { latestFireResult = JSON.parse(savedFireResult); } catch (err) { latestFireResult = null; }
    }
    latestSignageResult = localStorage.getItem("permit_assistant_signage_result");
    const savedTaskProgress = localStorage.getItem("permit_assistant_task_progress");
    if (savedTaskProgress) {
      try { taskProgress = JSON.parse(savedTaskProgress); } catch (err) { taskProgress = {}; }
    }
    const savedRequiresArchitect = localStorage.getItem("permit_assistant_requires_architect");
    if (savedRequiresArchitect) {
      try { requiresArchitect = JSON.parse(savedRequiresArchitect); } catch (err) { requiresArchitect = null; }
    }
    lastAddress = localStorage.getItem("permit_assistant_address");
    bizType = localStorage.getItem("permit_assistant_biz_type");

    renderRoadmap();
  }

  function resetStageIndicator() {
    caseFacts = {};
    caseTypeResult = null;
    latestPermitResult = null;
    latestFoodResult = null;
    latestFireResult = null;
    latestSignageResult = null;
    taskProgress = {};
    requiresArchitect = null;
    lastAddress = null;
    bizType = null;
    localStorage.removeItem("permit_assistant_address");
    localStorage.removeItem("permit_assistant_biz_type");
    localStorage.removeItem("permit_assistant_requires_architect");
    renderRoadmap();
    renderNextAction(null);
  }

  // 재접속ᆞ새로고침 시(대화를 시작하기 전) 프로젝트 진행 현황을 먼저
  // 보여준다 - "질문에 답하는 챗봇"이 아니라 "먼저 알려주는 프로젝트
  // 매니저" 원칙(2026-07-28 논의)의 핵심 기능. 진행한 게 있을 때만
  // 요약 말풍선을 띄운다(빈 세션은 emptyHint가 이미 안내 중이라 중복 불필요).
  async function loadProjectStatus() {
    try {
      const res = await fetch(`${API_BASE}/project-status?user_id=${encodeURIComponent(userId)}`);
      if (!res.ok) return;
      const status = await res.json();
      requiresArchitect = status.requires_architect ?? null;
      localStorage.setItem("permit_assistant_requires_architect", JSON.stringify(requiresArchitect));
      renderNextAction(status);
      renderRoadmap();
      if (status.progress > 0) {
        addMessage("bot", status.summary);
      }
    } catch (err) {
      console.error("진행 현황 조회 실패:", err);
    }
  }

  // 봇 답변에 섞여오는 마크다운(**굵게**, - 목록, `코드`)을 그대로 텍스트로
  // 찍으면 별표가 그대로 보여서 지저분해지므로, 안전하게 이스케이프한 뒤
  // 최소한의 문법만 변환한다. 사용자 메시지는 대상이 아님(textContent 그대로).
  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function renderInline(line) {
    return line
      .replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>")
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/(?<!\*)\*([^*]+)\*(?!\*)/g, "<em>$1</em>")
      .replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  function renderMarkdown(text) {
    const lines = escapeHtml(text).split("\n");
    const html = [];
    let listType = null; // "ul" | "ol" | null

    function closeList() {
      if (listType) { html.push(`</${listType}>`); listType = null; }
    }

    lines.forEach(rawLine => {
      const trimmed = rawLine.trim();
      const headerMatch = trimmed.match(/^(#{1,6})\s+(.*)$/);
      const hrMatch = trimmed.match(/^(-{3,}|\*{3,}|_{3,})$/);
      const bulletMatch = trimmed.match(/^[-*]\s+(.*)$/);
      const orderedMatch = trimmed.match(/^(\d+)\.\s+(.*)$/);

      if (headerMatch) {
        closeList();
        html.push(`<div class="md-h${headerMatch[1].length}">${renderInline(headerMatch[2])}</div>`);
      } else if (hrMatch) {
        closeList();
        html.push("<hr>");
      } else if (bulletMatch) {
        if (listType !== "ul") { closeList(); html.push("<ul>"); listType = "ul"; }
        html.push(`<li>${renderInline(bulletMatch[1])}</li>`);
      } else if (orderedMatch) {
        if (listType !== "ol") { closeList(); html.push("<ol>"); listType = "ol"; }
        // 번호를 브라우저 자동 매김에 맡기지 않고 value로 명시한다 - 번호 목록
        // 중간에 하위 불릿(-)이 끼면 <ol>이 한 번 닫혔다 새로 열리면서 브라우저가
        // 다시 1부터 세는 버그가 있었다(2026-08-04, "1. 2. 1."로 보이는 신고 -
        // 세션 3d2f20a1에서 재현 확인). value를 매 <li>마다 명시하면 <ol>이
        // 몇 번을 끊겨도 항상 원문 숫자 그대로 표시된다.
        html.push(`<li value="${orderedMatch[1]}">${renderInline(orderedMatch[2])}</li>`);
      } else {
        closeList();
        html.push(trimmed === "" ? "<br>" : `<div>${renderInline(rawLine)}</div>`);
      }
    });
    closeList();
    return html.join("");
  }

  function addMessage(role, text, { toolCalls = [], isError = false, lawContexts = [] } = {}) {
    emptyHint.remove();
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble" + (isError ? " error" : "");
    if (role === "bot") {
      bubble.innerHTML = renderMarkdown(text);
    } else {
      bubble.textContent = text;
    }
    wrap.appendChild(bubble);

    if (toolCalls && toolCalls.length > 0) {
      const tag = document.createElement("div");
      tag.className = "tool-tag";
      tag.textContent = "🔧 " + toolCalls.map(tc => tc.tool).join(", ");
      wrap.appendChild(tag);
    }

    // 법령 원문 카드 - answer의 [출처: ...] 인용을 실제로 검색된 원문과
    // 대조해볼 수 있게, 도구별로 펼쳐볼 수 있는 카드를 붙인다.
    (lawContexts || []).forEach((ctx) => {
      const details = document.createElement("details");
      details.className = "law-card";
      const summary = document.createElement("summary");
      summary.textContent = `📖 근거 원문 보기 — ${ctx.tool}`;
      const body = document.createElement("div");
      body.className = "law-card-body";
      body.textContent = ctx.text;
      details.appendChild(summary);
      details.appendChild(body);
      wrap.appendChild(details);
    });

    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
    return wrap;
  }

  function addTypingIndicator() {
    const wrap = document.createElement("div");
    wrap.className = "msg bot";
    wrap.id = "typingIndicator";
    wrap.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
    chatEl.appendChild(wrap);
    chatEl.scrollTop = chatEl.scrollHeight;
  }

  function removeTypingIndicator() {
    document.getElementById("typingIndicator")?.remove();
  }

  async function sendQuestion(question) {
    addMessage("user", question);
    questionEl.value = "";
    questionEl.style.height = "auto";
    sendBtn.disabled = true;
    addTypingIndicator();

    try {
      const res = await fetch(`${API_BASE}/query`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question, user_id: userId }),
      });

      const data = await res.json();
      removeTypingIndicator();

      if (!res.ok) {
        addMessage("bot", data.detail || "답변 생성에 실패했습니다.", { isError: true });
        return;
      }

      userId = data.user_id;
      localStorage.setItem("permit_assistant_user_id", userId);
      userIdLabel.textContent = `세션: ${userId.slice(0, 8)}`;

      addMessage("bot", data.answer, { toolCalls: data.tool_calls, lawContexts: data.law_contexts });

      // 한 턴에 여러 번 호출될 수 있어(record_case_facts + set_procedure_stage가
      // 같이 온 경우 등) 순서대로 전부 반영. 게이지에 필요한 required_documents/
      // pre_diagnosis_items는 여기서 도구 호출을 직접 재구성하지 않고, 서버가
      // finalize_node에서 이미 조립한 data.permit_result를 그대로 신뢰한다
      // (동일한 잠금 로직을 프론트에서 다시 구현하면 서버 로직과 어긋날 위험이 있음).
      let factsChanged = false;
      (data.tool_calls || []).forEach(tc => {
        if (tc.tool === "set_procedure_stage") {
          caseTypeResult = tc.args.case_type;
          localStorage.setItem("permit_assistant_case_type", caseTypeResult);
          factsChanged = true;
        } else if (tc.tool === "record_case_facts") {
          for (const [k, v] of Object.entries(tc.args)) {
            if (v !== null && v !== undefined) caseFacts[k] = v;
          }
          localStorage.setItem("permit_assistant_case_facts", JSON.stringify(caseFacts));
          factsChanged = true;
        } else if (tc.tool === "lookup_building_ledger" || tc.tool === "lookup_land_zone") {
          if (tc.args.address) {
            lastAddress = tc.args.address;
            localStorage.setItem("permit_assistant_address", lastAddress);
            factsChanged = true;
          }
        }
      });
      if (factsChanged) renderRoadmap();

      if (data.permit_result) {
        latestPermitResult = data.permit_result;
        localStorage.setItem("permit_assistant_permit_result", JSON.stringify(latestPermitResult));
      }
      if (data.food_result) {
        latestFoodResult = data.food_result;
        localStorage.setItem("permit_assistant_food_result", latestFoodResult);
        renderRoadmap();
      }
      // fire_result는 배열이라 null이 아니면(빈 배열 []도 포함) 판정 완료로 본다 -
      // JS에서 빈 배열도 truthy이므로 이 조건이 그대로 맞게 동작한다.
      if (data.fire_result) {
        latestFireResult = data.fire_result;
        localStorage.setItem("permit_assistant_fire_result", JSON.stringify(latestFireResult));
        renderRoadmap();
      }
      if (data.signage_result) {
        latestSignageResult = data.signage_result;
        localStorage.setItem("permit_assistant_signage_result", latestSignageResult);
        renderRoadmap();
      }
      // task_progress는 서버(merge_facts)가 이미 누적해서 전체 dict로 돌려주므로
      // 그대로 덮어쓴다 - 단, 아직 아무 것도 기록 안 된 턴엔 null/{}로 오니
      // 기존 값을 지우지 않도록 존재할 때만 반영한다.
      if (data.task_progress && Object.keys(data.task_progress).length > 0) {
        taskProgress = data.task_progress;
        localStorage.setItem("permit_assistant_task_progress", JSON.stringify(taskProgress));
        renderRoadmap();
      }
      // 건축사 대행 여부(건축법 제23조) - 백엔드 규칙 엔진 계산값을 그대로 보관.
      // case_facts처럼 새로고침 후에도 배지가 유지되도록 localStorage에 저장한다.
      if (data.project_status) {
        requiresArchitect = data.project_status.requires_architect ?? null;
        localStorage.setItem("permit_assistant_requires_architect", JSON.stringify(requiresArchitect));
      }
      // renderNextAction이 latestProjectStatus를 먼저 갱신해야, 뒤이은
      // renderRoadmap() 안의 renderSummaryCards()가 최신 값을 그린다.
      renderNextAction(data.project_status);
      renderRoadmap();
    } catch (err) {
      removeTypingIndicator();
      addMessage("bot", `서버에 연결할 수 없습니다: ${err.message}`, { isError: true });
    } finally {
      sendBtn.disabled = false;
      questionEl.focus();
    }
  }

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const q = questionEl.value.trim();
    if (!q) return;
    sendQuestion(q);
  });

  questionEl.addEventListener("keydown", (e) => {
    // e.isComposing: 한글 등 IME로 글자를 조합하는 중에 눌린 엔터는 무시.
    // 이걸 안 걸러주면 조합 확정용 엔터랑 전송용 엔터가 겹쳐서, preventDefault가
    // IME 조합 상태를 꼬아버려 마지막 글자가 다음 입력에 한 번 더 끼어드는
    // 문제가 생긴다.
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  questionEl.addEventListener("input", () => {
    questionEl.style.height = "auto";
    questionEl.style.height = Math.min(questionEl.scrollHeight, 120) + "px";
  });

  // Step 상세 화면(manyfast 페이지11 구조) - lastRoadmapSteps[idx]의
  // substeps를 그대로 체크리스트로 그리고(개요에서 뺀 체크박스가 여기로
  // 옮겨온 것), latestPermitResult의 required_documents/pre_diagnosis_items/
  // related_agencies를 서류ᆞ기관 카드로 보여준다 - 새 데이터 생성ᆞLLM
  // 호출 없이 이미 있는 구조화 데이터만 재배치한다. Step 인덱스는
  // renderRoadmap()의 steps 배열 순서와 같다(0:유형+대상판정, 1:건축인허가
  // 실무, 2:공사, 3:창업행정, 4:오픈준비).

  // "어느 부서가 접수하는지"라는 행정 상식 표(법령 판정 아님, CLAUDE.md §1과
  // 무관) - latestPermitResult.related_agencies(LLM이 record_permit_synthesis
  // 로 기록한 실제 협의기관)가 있으면 그게 우선, 없을 때만 폴백으로 쓴다.
  const STEP_AGENCY_FALLBACK = [
    [],
    ["관할 시ᆞ군ᆞ구청 건축과"],
    ["관할 시ᆞ군ᆞ구청 건축과", "관할 소방서"],
    ["관할 세무서(사업자등록)", "관할 보건소(위생교육)", "관할 시ᆞ군ᆞ구청 건축과(간판)"],
    ["근로복지공단(4대보험)"],
  ];

  function showRoadmapOverview() {
    stepDetailEl.style.display = "none";
    roadmapOverviewEl.style.display = "";
    nextActionEl.style.display = "";
    openStepDetailIdx = null;
  }

  function showStepDetail(idx, title) {
    roadmapOverviewEl.style.display = "none";
    stepDetailEl.style.display = "";
    nextActionEl.style.display = "none"; // 13% 배너는 로드맵 개요에서만 - 상세 화면에선 숨긴다
    openStepDetailIdx = idx;
    renderStepDetail(idx, title);
    stepDetailEl.scrollTop = 0;
  }

  function renderStepDetail(idx, title) {
    const step = lastRoadmapSteps[idx] || { substeps: [] };
    const items = step.substeps.filter((s) => !s.info);
    const doneCount = items.filter((s) => s.done).length;
    const allDone = items.length > 0 && doneCount === items.length;
    // 개요 목록과 같은 기준(allDone/isCurrent/hasProgress) - idx===currentIdx도
    // "진행 중"으로 본다(체크 항목이 0개라도 지금 여기 단계라면 대기가 아님).
    const hasProgress = doneCount > 0 && !allDone;
    const isCurrent = idx === lastRoadmapCurrentIdx && !allDone;
    const statusWord = allDone ? "완료" : (isCurrent || hasProgress) ? "진행 중" : "대기";
    stepDetailTitleEl.innerHTML = `${title} <span class="step-detail-status">${statusWord}</span>`;

    const agencies = (latestPermitResult?.related_agencies?.length
      ? latestPermitResult.related_agencies
      : STEP_AGENCY_FALLBACK[idx]) || [];
    const metaParts = [`예상 준비 기간 ${formatDurationDays(stepDurationDays(idx))}`];
    if (agencies.length) metaParts.push(`관할 기관: ${agencies.join(", ")}`);
    stepDetailMetaEl.textContent = metaParts.join(" ᆞ ");

    // 체크리스트 - info(참고용 서류ᆞ사전진단 나열) 줄은 아래 "필요 서류"
    // 카드에서 따로 보여주므로 여기선 뺀다.
    stepChecklistEl.innerHTML = "";
    step.substeps.filter((s) => !s.info).forEach((sub) => {
      const row = document.createElement("div");
      row.className = "step-checklist-item";
      const lockedNow = sub.locked && !sub.done;
      let tag = sub.field ? "필수" : "권장";
      if (sub.notApplicable) tag = "해당없음";
      else if (lockedNow) tag = "선행조건 필요";

      if (sub.field && !lockedNow) {
        const checkboxId = `step-check-${sub.field}`;
        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.id = checkboxId;
        checkbox.checked = sub.done;
        checkbox.disabled = !!sub.notApplicable;
        checkbox.addEventListener("change", () => toggleTaskProgress(sub.field, checkbox.checked));
        const label = document.createElement("label");
        label.htmlFor = checkboxId;
        label.textContent = sub.text;
        row.appendChild(checkbox);
        row.appendChild(label);
      } else {
        const bullet = document.createElement("span");
        bullet.className = "step-checklist-bullet";
        bullet.textContent = sub.done ? "✓" : lockedNow ? "🔒" : "○";
        const text = document.createElement("span");
        text.textContent = sub.text;
        row.appendChild(bullet);
        row.appendChild(text);
      }
      if (sub.notApplicable || lockedNow) row.classList.add("muted");
      const tagEl = document.createElement("span");
      tagEl.className = "step-checklist-tag";
      tagEl.textContent = tag;
      row.appendChild(tagEl);
      stepChecklistEl.appendChild(row);
    });
    if (!stepChecklistEl.children.length) {
      stepChecklistEl.innerHTML = '<div class="step-detail-empty">이 단계에서 확인할 항목이 없습니다.</div>';
    }

    // 필요 서류 - permit_result가 있는 Step(주로 Step1)만 실제 값을 갖고
    // 있다. 다운로드 버튼은 만들지 않는다(실제 템플릿 파일이 없다는 기존
    // 결정 유지) - 서류명만 카드로.
    const docs = [...(latestPermitResult?.pre_diagnosis_items || []), ...(latestPermitResult?.required_documents || [])];
    stepDocsEl.innerHTML = docs.length
      ? docs.map((d) => `<div class="step-doc-card">${escapeHtml(d)}</div>`).join("")
      : '<div class="step-detail-empty">관련 서류는 채팅으로 확인해주세요.</div>';

    // 관련 기관 및 전문가
    stepAgenciesEl.innerHTML = agencies.length
      ? agencies.map((a) => `<div class="step-agency-card">${escapeHtml(a)}</div>`).join("")
      : '<div class="step-detail-empty">관련 기관 정보가 아직 없습니다.</div>';

    // manyfast의 "챗봇 Q&A"/"문서 템플릿 목록" 버튼 역할 - 우리는 챗봇이
    // 항상 왼쪽에 고정돼 있고 문서는 이미 이 화면에 있으니, 별도 페이지
    // 대신 포커스ᆞ스크롤 이동으로 대체한다(정직한 단순화).
    stepAskBtn.onclick = () => {
      questionEl.value = `${title} 단계에 대해 더 자세히 알려줘`;
      showRoadmapOverview();
      questionEl.focus();
    };
    stepDocsNavBtn.onclick = () => {
      stepDocsEl.scrollIntoView({ behavior: "smooth", block: "start" });
    };
  }

  stepDetailBackBtn.addEventListener("click", showRoadmapOverview);

  newChatBtn.addEventListener("click", () => {
    localStorage.removeItem("permit_assistant_user_id");
    localStorage.removeItem("permit_assistant_case_facts");
    localStorage.removeItem("permit_assistant_case_type");
    localStorage.removeItem("permit_assistant_permit_result");
    localStorage.removeItem("permit_assistant_food_result");
    localStorage.removeItem("permit_assistant_fire_result");
    localStorage.removeItem("permit_assistant_signage_result");
    localStorage.removeItem("permit_assistant_task_progress");
    userId = getUserId();
    userIdLabel.textContent = `세션: ${userId.slice(0, 8)}`;
    chatEl.innerHTML = "";
    chatEl.appendChild(emptyHint);
    resetStageIndicator();
    showRoadmapOverview();
  });

  restoreStageIndicator();
  loadProjectStatus();
  questionEl.focus();
</script>
</body>
</html>
