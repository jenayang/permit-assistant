<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로드맵 만들기 - 서울시 창업 로드맵 어시스턴트</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e5ea;
    --text: #1f2328;
    --text-muted: #6b7280;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --error: #dc2626;
    --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 4px 14px rgba(16, 24, 40, .05);
    --surface-2: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181c; --panel: #1d1f24; --border: #2c2f36; --text: #e6e7ea;
      --text-muted: #9aa0aa; --bot-bubble: #262931; --surface-2: #26282f;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; background: var(--bg); color: var(--text); }
  .layout { max-width: 760px; margin: 0 auto; padding: 24px 20px 60px; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
  fieldset { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
  legend { font-weight: 600; padding: 0 6px; }
  .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
  .field label { font-size: 13px; color: var(--text-muted); }
  .field input, .field select { padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 14px; }
  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }
  .addr-row { display: flex; gap: 8px; }
  .addr-row input { flex: 1; }
  button { cursor: pointer; border: none; border-radius: 6px; font-size: 14px; }
  #submitBtn { background: var(--accent); color: var(--accent-text); padding: 12px 20px; width: 100%; font-weight: 600; }
  #submitBtn:disabled { opacity: .6; cursor: default; }
  .addr-row button { background: var(--surface-2); color: var(--text); padding: 0 14px; }
  #result { display: none; margin-top: 20px; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); box-shadow: var(--shadow); padding: 16px 18px; }
  #result h2 { font-size: 15px; margin: 0 0 10px; }
  #result dl { margin: 0; }
  #result dt { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
  #result dd { margin: 2px 0 0; font-size: 14px; }
  #resultLink { display: inline-block; margin-top: 14px; background: var(--accent); color: var(--accent-text); padding: 10px 16px; border-radius: 6px; text-decoration: none; font-size: 14px; font-weight: 600; }
  #addrStatus { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  #formError { color: var(--error); font-size: 13px; margin-top: 8px; display: none; }
</style>
</head>
<body>
<div class="layout">
  <h1>로드맵 만들기</h1>
  <div class="sub">아는 항목만 채워도 됩니다 - 비워두면 나중에 채팅으로 이어서 물어봅니다.</div>

  <fieldset>
    <legend>주소 (선택)</legend>
    <div class="addr-row">
      <input id="address" placeholder="예: 서울특별시 강남구 테헤란로 123">
      <button id="addrBtn" type="button">주소로 자동조회</button>
    </div>
    <div id="addrStatus"></div>
  </fieldset>

  <fieldset>
    <legend>건축 (인허가 판정)</legend>
    <div class="field">
      <label for="act_type">행위 유형</label>
      <select id="act_type">
        <option value="">모름</option>
        <option>신축</option><option>증축</option><option>개축</option>
        <option>재축</option><option>이전</option><option>대수선</option>
        <option>용도변경</option><option>일반수선</option><option>가설건축물</option>
      </select>
    </div>
    <div class="row">
      <div class="field"><label for="size_sqm">연면적(㎡)</label><input id="size_sqm" type="number" step="0.1"></div>
      <div class="field"><label for="floors">층수</label><input id="floors" type="number" step="1"></div>
    </div>
    <div class="field">
      <label for="extension_size_sqm">증축ᆞ개축ᆞ재축 대상 부분 면적(㎡)</label>
      <input id="extension_size_sqm" type="number" step="0.1">
    </div>
    <div class="field">
      <label for="land_zone">용도지역 (주소 자동조회로 채워질 수 있음)</label>
      <select id="land_zone">
        <option value="">모름</option>
        <option>관리지역</option><option>농림지역</option>
        <option>자연환경보전지역</option><option>기타</option>
      </select>
    </div>
    <div class="field">
      <label for="renovation_scope">대수선 대상 여부(내력벽ᆞ기둥ᆞ보 등 변경)</label>
      <select id="renovation_scope"><option value="">모름</option><option value="true">예</option><option value="false">아니오</option></select>
    </div>
    <div class="row">
      <div class="field">
        <label for="current_facility_group">기존 시설군 (주소 자동조회로 채워질 수 있음)</label>
        <select id="current_facility_group"></select>
      </div>
      <div class="field">
        <label for="desired_facility_group">희망 시설군(용도변경 시)</label>
        <select id="desired_facility_group"></select>
      </div>
    </div>
    <div class="field">
      <label for="ownership">소유 형태</label>
      <select id="ownership"><option value="">모름</option><option>소유자</option><option>임차인</option></select>
    </div>
  </fieldset>

  <fieldset>
    <legend>식품위생 (영업 종류 판정)</legend>
    <div class="field">
      <label for="serves_food">음식ᆞ식품을 취급하는 업종인가요?</label>
      <select id="serves_food"><option value="">모름</option><option value="true">예</option><option value="false">아니오</option></select>
    </div>
    <div class="field">
      <label for="manufactures_or_cooks">매장에서 직접 조리ᆞ제조ᆞ가공하나요? (완제품만 되팔면 아니오)</label>
      <select id="manufactures_or_cooks"><option value="">모름</option><option value="true">예</option><option value="false">아니오</option></select>
    </div>
    <div class="field">
      <label for="primarily_bakery">주로 빵ᆞ과자를 만들어 파는 제과점인가요?</label>
      <select id="primarily_bakery"><option value="">모름</option><option value="true">예</option><option value="false">아니오</option></select>
    </div>
    <div class="field">
      <label for="serves_alcohol">주류를 판매하나요?</label>
      <select id="serves_alcohol"><option value="">모름</option><option value="true">예</option><option value="false">아니오</option></select>
    </div>
    <div class="field">
      <label for="store_area_sqm">영업장 면적(㎡)</label>
      <input id="store_area_sqm" type="number" step="0.1">
    </div>
  </fieldset>

  <fieldset>
    <legend>소방시설</legend>
    <div class="field">
      <label for="is_large_store_tenant">대규모점포(백화점ᆞ쇼핑센터 등)에 입점하나요?</label>
      <select id="is_large_store_tenant"><option value="">모름</option><option value="true">예</option><option value="false">아니오</option></select>
    </div>
    <div class="sub">연면적은 위 건축 섹션의 연면적을 그대로 씁니다.</div>
  </fieldset>

  <fieldset>
    <legend>간판ᆞ옥외광고물</legend>
    <div class="field">
      <label for="sign_type">간판 종류</label>
      <select id="sign_type">
        <option value="">해당 없음</option>
        <option>벽면이용간판</option><option>돌출간판</option>
        <option>지주이용간판</option><option>입간판</option><option>현수막</option>
      </select>
    </div>
    <div class="row">
      <div class="field"><label for="length_m">간판 한 변 길이(m, 벽면이용)</label><input id="length_m" type="number" step="0.1"></div>
      <div class="field"><label for="floor">설치 층수(벽면이용)</label><input id="floor" type="number" step="1"></div>
    </div>
    <div class="row">
      <div class="field"><label for="area_sqm">간판 면적(㎡, 벽면ᆞ돌출)</label><input id="area_sqm" type="number" step="0.1"></div>
      <div class="field"><label for="height_m">지면~윗부분 높이(m, 돌출ᆞ지주)</label><input id="height_m" type="number" step="0.1"></div>
    </div>
    <div class="field">
      <label for="is_third_party_ad">타사 광고인가요? (본인 업소 광고면 아니오, 벽면이용)</label>
      <select id="is_third_party_ad"><option value="">모름</option><option value="true">예</option><option value="false">아니오</option></select>
    </div>
    <div class="field">
      <label for="is_medical_or_salon_sign">의료기관ᆞ약국ᆞ이용ᆞ미용업소 표지등인가요? (돌출)</label>
      <select id="is_medical_or_salon_sign"><option value="">모름</option><option value="true">예</option><option value="false">아니오</option></select>
    </div>
    <div class="field">
      <label for="display_facility_area_sqm">게시시설 면적(㎡, 현수막)</label>
      <input id="display_facility_area_sqm" type="number" step="0.1">
    </div>
  </fieldset>

  <button id="submitBtn" type="button">판정하기</button>
  <div id="formError"></div>

  <div id="result">
    <h2>판정 결과</h2>
    <dl id="resultBody"></dl>
    <a id="resultLink" href="/ui/">로드맵으로 이동 →</a>
  </div>
</div>

<script>
  const API_BASE = "";

  // index.html과 동일한 localStorage 키를 써서, "로드맵으로 이동"을 누르면
  // /ui/(index.html)가 같은 user_id로 방금 입력한 결과를 그대로 보여준다.
  function getUserId() {
    let id = localStorage.getItem("permit_assistant_user_id");
    if (!id) {
      id = crypto.randomUUID();
      localStorage.setItem("permit_assistant_user_id", id);
    }
    return id;
  }

  const FACILITY_GROUPS = {
    1: "1. 자동차 관련 시설군", 2: "2. 산업 등 시설군", 3: "3. 전기통신시설군",
    4: "4. 문화집회시설군", 5: "5. 영업시설군", 6: "6. 교육 및 복지시설군",
    7: "7. 근린생활시설군", 8: "8. 주거업무시설군", 9: "9. 그 밖의 시설군",
  };
  for (const id of ["current_facility_group", "desired_facility_group"]) {
    const sel = document.getElementById(id);
    sel.innerHTML = '<option value="">모름</option>' +
      Object.entries(FACILITY_GROUPS).map(([n, label]) => `<option value="${n}">${label}</option>`).join("");
  }

  function numOrNull(id) {
    const v = document.getElementById(id).value;
    return v === "" ? null : Number(v);
  }
  function strOrNull(id) {
    const v = document.getElementById(id).value;
    return v === "" ? null : v;
  }
  function boolOrNull(id) {
    const v = document.getElementById(id).value;
    return v === "" ? null : v === "true";
  }
  function dropNulls(obj) {
    const out = {};
    for (const [k, v] of Object.entries(obj)) if (v !== null) out[k] = v;
    return out;
  }

  document.getElementById("addrBtn").addEventListener("click", async () => {
    const address = document.getElementById("address").value.trim();
    const statusEl = document.getElementById("addrStatus");
    if (!address) { statusEl.textContent = "주소를 입력하세요."; return; }
    statusEl.textContent = "조회 중...";
    try {
      const res = await fetch(`${API_BASE}/facts`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user_id: getUserId(), address }),
      });
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      const data = await res.json();
      if (data.case_facts.land_zone) document.getElementById("land_zone").value = data.case_facts.land_zone;
      if (data.case_facts.current_facility_group) document.getElementById("current_facility_group").value = data.case_facts.current_facility_group;
      statusEl.textContent = (data.case_facts.land_zone || data.case_facts.current_facility_group)
        ? "자동조회로 일부 항목이 채워졌습니다."
        : "자동조회 결과가 없습니다 - 직접 입력해 주세요.";
    } catch (e) {
      statusEl.textContent = `조회 실패: ${e.message}`;
    }
  });

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const btn = document.getElementById("submitBtn");
    const errEl = document.getElementById("formError");
    errEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "판정 중...";

    const case_facts = dropNulls({
      act_type: strOrNull("act_type"),
      size_sqm: numOrNull("size_sqm"),
      floors: numOrNull("floors"),
      extension_size_sqm: numOrNull("extension_size_sqm"),
      land_zone: strOrNull("land_zone"),
      renovation_scope: boolOrNull("renovation_scope"),
      current_facility_group: numOrNull("current_facility_group"),
      desired_facility_group: numOrNull("desired_facility_group"),
      ownership: strOrNull("ownership"),
    });
    const food_facts = dropNulls({
      serves_food: boolOrNull("serves_food"),
      manufactures_or_cooks: boolOrNull("manufactures_or_cooks"),
      primarily_bakery: boolOrNull("primarily_bakery"),
      serves_alcohol: boolOrNull("serves_alcohol"),
      store_area_sqm: numOrNull("store_area_sqm"),
    });
    const fire_facts = dropNulls({
      size_sqm: numOrNull("size_sqm"),
      is_large_store_tenant: boolOrNull("is_large_store_tenant"),
    });
    const signage_facts = dropNulls({
      sign_type: strOrNull("sign_type"),
      length_m: numOrNull("length_m"),
      floor: numOrNull("floor"),
      is_third_party_ad: boolOrNull("is_third_party_ad"),
      area_sqm: numOrNull("area_sqm"),
      height_m: numOrNull("height_m"),
      is_medical_or_salon_sign: boolOrNull("is_medical_or_salon_sign"),
      display_facility_area_sqm: numOrNull("display_facility_area_sqm"),
    });

    const body = { user_id: getUserId() };
    const address = document.getElementById("address").value.trim();
    if (address) body.address = address;
    if (Object.keys(case_facts).length) body.case_facts = case_facts;
    if (Object.keys(food_facts).length) body.food_facts = food_facts;
    if (Object.keys(fire_facts).length) body.fire_facts = fire_facts;
    if (Object.keys(signage_facts).length) body.signage_facts = signage_facts;

    try {
      const res = await fetch(`${API_BASE}/facts`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
      const data = await res.json();
      persistToIndexStorage(data);
      renderResult(data);
    } catch (e) {
      errEl.textContent = `제출 실패: ${e.message}`;
      errEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "판정하기";
    }
  });

  // index.html의 restoreStageIndicator()가 읽는 localStorage 키와 정확히
  // 같은 이름ᆞ형식으로 저장한다 - "로드맵으로 이동"을 눌렀을 때 index.html이
  // 채팅으로 판정받은 것과 똑같이 이 결과를 즉시 인식하게 하기 위함(예:
  // 사이드패널 "필요 서류" 탭은 permit_assistant_case_type을 본다).
  function persistToIndexStorage(data) {
    if (data.case_facts && Object.keys(data.case_facts).length) {
      localStorage.setItem("permit_assistant_case_facts", JSON.stringify(data.case_facts));
    }
    if (data.permit_preview) {
      localStorage.setItem("permit_assistant_case_type", data.permit_preview.permit_type);
      localStorage.setItem("permit_assistant_permit_result", JSON.stringify(data.permit_preview));
    }
    if (data.food_result) localStorage.setItem("permit_assistant_food_result", data.food_result);
    if (data.fire_result) localStorage.setItem("permit_assistant_fire_result", JSON.stringify(data.fire_result));
    if (data.signage_result) localStorage.setItem("permit_assistant_signage_result", data.signage_result);
    const address = document.getElementById("address").value.trim();
    if (address) localStorage.setItem("permit_assistant_address", address);
  }

  function renderResult(data) {
    const body = document.getElementById("resultBody");
    const rows = [];
    if (data.permit_preview) {
      rows.push(["건축 인허가", data.permit_preview.permit_type]);
      if (data.permit_preview.procedures.length) rows.push(["절차", data.permit_preview.procedures.join(" → ")]);
    } else {
      rows.push(["건축 인허가", "판정에 필요한 정보가 더 필요합니다."]);
    }
    if (data.food_result) rows.push(["식품위생 영업 종류", data.food_result]);
    if (data.fire_result) rows.push(["소방시설", data.fire_result.length ? data.fire_result.join(", ") : "설치 대상 없음"]);
    if (data.signage_result) rows.push(["간판ᆞ옥외광고물", data.signage_result]);
    rows.push(["전체 진행률", `${data.project_status.progress}%`]);

    body.innerHTML = rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
    document.getElementById("result").style.display = "block";
    document.getElementById("result").scrollIntoView({ behavior: "smooth" });
  }
</script>
</body>
</html>
