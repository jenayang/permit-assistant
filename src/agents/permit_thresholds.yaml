# 법정 임계값 - 법령 개정 시 이 파일의 숫자만 고치면 됨.
# classify_case()의 판단 흐름(if/elif 구조)은 이 파일과 무관하게 permit.py에
# 그대로 남아있고, 여기서는 그 흐름이 참조하는 "값"만 관리한다.
#
# 각 항목의 근거 조항은 permit.py의 classify_case() 주석 및 이 파일의 인라인
# 주석 참고. 값 변경 시 반드시 원문(국가법령정보센터 등) 대조 후 수정할 것.

# 건축법 제14조: 증축ᆞ개축ᆞ재축 대상 부분의 바닥면적이 이 값(㎡) 이하면 신고.
증축개축재축_신고_상한_바닥면적_sqm: 85

# 건축법 제14조: 신축이 아래 용도지역에 해당하면서 연면적ᆞ층수가 둘 다 기준
# 미만이어야 신고. 하나라도 기준을 벗어나면 허가.
신축_신고:
  대상_용도지역: [관리지역, 농림지역, 자연환경보전지역]
  연면적_미만_sqm: 200
  층수_미만: 3

# 대수선도 신축과 동일한 200㎡/3층 기준을 재사용(단, 용도지역 제한은 없음 -
# renovation_scope가 True인 경우에만 이 기준을 적용).
대수선_신고:
  연면적_미만_sqm: 200
  층수_미만: 3

# 건축법 시행령 제15조: 존치기간 이 값(년) 이하 + 비철근콘크리트ᆞ철골조면 신고.
# 신고_목적_예외에 해당하는 목적은 기간ᆞ구조와 무관하게 그 자체로 신고 대상.
가설건축물:
  신고_존치기간_이하_년: 3
  신고_목적_예외: [재해복구, 전시박람회, 공사용, 견본주택, 비닐하우스, 컨테이너]

# 서울특별시 도시계획 조례 제44조ㆍ제48조: 세부 용도지역별 건폐율ㆍ용적률
